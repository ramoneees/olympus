apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-config
  namespace: olympus
  labels:
    app: librechat
data:
  librechat.yaml: |
    version: 1.3.5
    cache: true
    endpoints:
      custom:
        - name: "OLYMPUS"
          apiKey: "${LITELLM_MASTER_KEY}"
          baseURL: "http://litellm.olympus.svc.cluster.local:4000/v1"
          models:
            default:
              - "MiniMax-M2.5"
              - "image-01"
            fetch: true
          titleConvo: true
          titleModel: "MiniMax-M2.5"
          modelDisplayLabel: "OLYMPUS"
          disableStatusCheck: false
    mcpServers:
      minimax:
        type: stdio
        command: npx
        args:
          - "-y"
          - "minimax-mcp-js"
        env:
          MINIMAX_API_KEY: "${MINIMAX_API_KEY}"
          MINIMAX_API_HOST: "https://api.minimaxi.chat"
          MINIMAX_MCP_BASE_PATH: "/app/data"
          MINIMAX_RESOURCE_MODE: "url"
        trustTools: true
      web-reader:
        type: stdio
        command: npx
        args:
          - "-y"
          - "@modelcontextprotocol/server-fetch"
        trustTools: true
      web-search:
        type: stdio
        command: npx
        args:
          - "-y"
          - "@modelcontextprotocol/server-brave-search"
        env:
          BRAVE_API_KEY: "${BRAVE_API_KEY}"
        trustTools: true
