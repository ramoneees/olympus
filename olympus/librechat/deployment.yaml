apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat
  namespace: olympus
  labels:
    app: librechat
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librechat
  template:
    metadata:
      labels:
        app: librechat
    spec:
      nodeSelector:
        kubernetes.io/hostname: olympus
      containers:
        - name: librechat
          image: ghcr.io/danny-avila/librechat:latest
          ports:
            - containerPort: 3080
          env:
            # Core
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3080"
            - name: DOMAIN_CLIENT
              value: "https://ai.ramoneees.com"
            - name: DOMAIN_SERVER
              value: "https://ai.ramoneees.com"
            - name: NO_INDEX
              value: "true"

            # Database
            - name: MONGO_URI
              value: "mongodb://mongodb.olympus.svc.cluster.local:27017/LibreChat"

            # Redis (reuse existing)
            - name: REDIS_URI
              value: "redis://redis-master.databases.svc.cluster.local:6379"

            # LLM via LiteLLM (configured in librechat.yaml custom endpoint)
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secret
                  key: litellm-master-key

            # Image Generation (OpenAI-compatible → LiteLLM)
            - name: IMAGE_GEN_OAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secret
                  key: litellm-master-key
            - name: IMAGE_GEN_OAI_BASEURL
              value: "http://litellm.olympus.svc.cluster.local:4000/v1"
            - name: IMAGE_GEN_OAI_MODEL
              value: "minimax/image-01"

            # TTS/STT (OpenAI-compatible → LiteLLM)
            - name: TTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secret
                  key: litellm-master-key
            - name: STT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secret
                  key: litellm-master-key

            # Auth
            - name: ALLOW_REGISTRATION
              value: "false"
            - name: ALLOW_PASSWORD_RESET
              value: "false"

            # Config
            - name: CONFIG_PATH
              value: "/app/librechat.yaml"

            # For librechat.yaml interpolation
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secret
                  key: litellm-master-key

            # JWT Secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-secret
                  key: jwt-secret
          volumeMounts:
            - name: config
              mountPath: /app/librechat.yaml
              subPath: librechat.yaml
            - name: librechat-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3080
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: librechat-config
        - name: librechat-data
          persistentVolumeClaim:
            claimName: librechat-data
---
apiVersion: v1
kind: Service
metadata:
  name: librechat
  namespace: olympus
  labels:
    app: librechat
spec:
  type: ClusterIP
  ports:
    - port: 3080
      targetPort: 3080
  selector:
    app: librechat
