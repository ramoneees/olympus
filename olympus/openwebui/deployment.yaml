# OpenWebUI — Web-based LLM chat interface
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: olympus
  labels:
    app: openwebui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      nodeSelector:
        kubernetes.io/hostname: olympus
      securityContext:
        fsGroup: 1000
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:v0.9.6
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WEBUI_SECRET
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret
                  key: webui-secret
            - name: DATA_DIR
              value: "/app/backend/data"
            # Use TEI (bge-m3) for embeddings instead of downloading from HuggingFace
            - name: RAG_EMBEDDING_ENGINE
              value: "openai"
            - name: RAG_EMBEDDING_MODEL
              value: "bge-m3"
            - name: RAG_OPENAI_API_BASE_URL
              value: "http://tei.olympus.svc.cluster.local:80/v1"
            - name: RAG_OPENAI_API_KEY
              value: "none"
            - name: ENABLE_RAG_LOCAL_MODEL_FETCH
              value: "false"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: DEFAULT_MODEL_PARAMS
              value: '{"gemma-4b":{"temperature":0.3,"max_tokens":4096}}'
            # Connect to LiteLLM proxy for all cloud models (GLM, MiniMax, Qwen, etc.)
            - name: OPENAI_API_BASE_URL
              value: "http://litellm.olympus.svc.cluster.local:4000/v1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret
                  key: litellm-api-key
            # UX / privacy
            - name: WEBUI_NAME
              value: "OLYMPUS AI"
            - name: ENABLE_COMMUNITY_SHARING
              value: "false"
            - name: ENABLE_SIGNUP
              value: "false"
            - name: DEFAULT_USER_ROLE
              value: "admin"
            - name: WEBUI_AUTH
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-data
  namespace: olympus
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openwebui
  namespace: olympus
spec:
  type: NodePort
  selector:
    app: openwebui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31400