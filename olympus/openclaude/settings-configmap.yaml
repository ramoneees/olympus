---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaude-settings
  namespace: olympus
data:
  settings.json: |
    {
      "permissions": {
        "allow": [
          "Bash(kubectl:*)",
          "Bash(git:*)",
          "Bash(curl:*)",
          "Bash(grep:*)",
          "Bash(cat:*)",
          "Bash(ls:*)",
          "WebSearch(*)",
          "WebFetch(*)",
          "Read(*)",
          "Edit(*)",
          "Write(*)",
          "Glob(*)",
          "Grep(*)"
        ]
      }
    }
