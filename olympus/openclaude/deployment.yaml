# OpenClaude — headless gRPC AI reviewer + HTTP adapter sidecar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaude
  namespace: olympus
  labels:
    app: openclaude
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaude
  template:
    metadata:
      labels:
        app: openclaude
    spec:
      nodeSelector:
        kubernetes.io/hostname: olympus
      containers:
        - name: openclaude
          image: git.ramoneees.com/olympus/openclaude:latest
          imagePullPolicy: Always
          command: ["node", "dist/scripts/start-grpc.mjs"]
          ports:
            - name: grpc
              containerPort: 50051
          env:
            - name: GRPC_HOST
              value: "0.0.0.0"
            - name: GRPC_PORT
              value: "50051"
            - name: CLAUDE_CODE_USE_OPENAI
              value: "1"
            - name: OPENAI_BASE_URL
              value: "http://litellm.olympus.svc.cluster.local:4000/v1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaude-secret
                  key: litellm-master-key
            - name: OPENAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: openclaude-config
                  key: QUICK_MODEL
            - name: WEB_SEARCH_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: openclaude-config
                  key: WEB_SEARCH_PROVIDER
            - name: BRAVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaude-secret
                  key: brave-api-key
          volumeMounts:
            - name: claude-settings
              mountPath: /home/node/.claude/settings.json
              subPath: settings.json
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5

        - name: http-adapter
          image: git.ramoneees.com/olympus/openclaude:latest
          imagePullPolicy: Always
          command: ["node", "http-adapter/index.js"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: openclaude-config
          env:
            - name: GRPC_HOST
              value: "localhost"
            - name: GRPC_PORT
              value: "50051"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5

      volumes:
        - name: claude-settings
          configMap:
            name: openclaude-settings
