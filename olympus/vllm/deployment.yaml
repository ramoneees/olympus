# vLLM — gemma-4-E4B-it, AWQ INT4, OpenAI-compatible API
# Local LLM inference for gemma-4-E4B-it (AWQ INT4, ~3-4GB VRAM).
# Strategy: Recreate — GPU is exclusive, rolling update not possible.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: olympus
  labels:
    app: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: olympus
      # Kubernetes injects VLLM_PORT=tcp://... from the Service, which crashes vLLM's
      # internal int(os.getenv('VLLM_PORT')) call. Disable service link injection.
      enableServiceLinks: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.22.1
          args:
            - "--model"
            - "Chunity/gemma-4-E4B-it-AWQ-4bit"
            - "--quantization"
            - "awq"
            - "--dtype"
            - "float16"
            - "--served-model-name"
            - "gemma-4b"
            - "--max-model-len"
            - "8192"
            - "--gpu-memory-utilization"
            - "0.85"
            - "--enforce-eager"
            - "--port"
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: "/models"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: VLLM_USE_V1
              value: "0"
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
          # startupProbe allows up to 20 min for first-run model download from HuggingFace
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 120
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-models
  namespace: olympus
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: olympus
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
