# Redis — shared instance for cache + Mnemosyne short-term memory
# Chart: redis
# Repo: https://charts.bitnami.com/bitnami
#
# Database allocation:
#   0  — Gitea cache
#   1  — Gitea sessions
#   2  — Gitea queues
#   3  — Authentik
#   4  — Nextcloud
#   5  — Mnemosyne short-term memory
#   6-15 — available

architecture: standalone

# TEMP: pinned to latest — Bitnami removed versioned tags from Docker Hub.
# Must be top-level `image:` — this chart does NOT read master.image.tag,
# so that key was previously silently ignored (main pod kept pulling the
# removed 7.4.3-debian-12-r0 tag despite this being "set").
image:
  tag: latest

auth:
  enabled: false  # LAN-only, no auth needed for internal services

master:
  configuration: |
    maxmemory 200mb
    maxmemory-policy allkeys-lru
  nodeSelector:
    kubernetes.io/hostname: olympus
  persistence:
    enabled: true
    storageClass: longhorn
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  service:
    type: NodePort
    ports:
      redis: 6379
    nodePorts:
      redis: "30637"

metrics:
  enabled: false
  image:
    tag: latest
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
