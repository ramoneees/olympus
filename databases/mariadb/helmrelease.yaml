apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb
  namespace: databases
spec:
  interval: 10m
  chart:
    spec:
      chart: mariadb
      version: "20.*"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    # Don't wait on StatefulSet health: with OrderedReady, a crash-looping mariadb-0
    # makes Helm fail early and roll back before the new pod spec is ever rolled out,
    # so a probe/image fix could never land (2026-10-03 incident).
    disableWait: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: mariadb-helm-values
