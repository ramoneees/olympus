apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: databases
resources:
  - helmrelease.yaml
  - secrets.yaml
  - pgvector-reindex-job.yaml
configMapGenerator:
  - name: postgresql-helm-values
    files:
      - values.yaml=values.yaml
    options:
      disableNameSuffixHash: true
  # Required by pgvector-reindex-job.yaml (mounts /scripts/migrate-to-bge-m3.sql)
  - name: pgvector-migration-scripts
    files:
      - migrate-to-bge-m3.sql=migrate-to-bge-m3.sql
    options:
      disableNameSuffixHash: true
