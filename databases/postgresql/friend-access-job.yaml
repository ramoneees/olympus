---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-friend-readonly-user
  namespace: databases
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: friend-access-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: postgresql.databases.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgres-password
            - name: FRIEND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: friend-access-secret
                  key: db-password
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for PostgreSQL..."
              until pg_isready -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}"; do sleep 2; done

              echo "Creating friend_readonly role..."
              psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d postgres -c \
                "DO \$\$ BEGIN
                   IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'friend_readonly') THEN
                     CREATE ROLE friend_readonly WITH LOGIN;
                   END IF;
                 END \$\$;"

              psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d postgres \
                -c "ALTER ROLE friend_readonly WITH PASSWORD '${FRIEND_PASSWORD}';"

              psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d postgres \
                -c "GRANT CONNECT ON DATABASE team_organizer TO friend_readonly;"

              echo "Granting SELECT on team_organizer..."
              psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d team_organizer -c \
                "GRANT USAGE ON SCHEMA public TO friend_readonly;
                 GRANT SELECT ON ALL TABLES IN SCHEMA public TO friend_readonly;
                 ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO friend_readonly;"

              echo "Done — friend_readonly can SELECT all tables in team_organizer"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
