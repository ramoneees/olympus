apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - helmrelease.yaml
  - ingress.yaml
  # - secrets.yaml  # Managed manually — Flux must not overwrite real admin password with template placeholders
configMapGenerator:
  - name: gitea-helm-values
    files:
      - values.yaml=values.yaml
    options:
      disableNameSuffixHash: true
