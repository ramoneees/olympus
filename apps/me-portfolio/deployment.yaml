---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: me-portfolio
  namespace: apps
  labels:
    app: me-portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: me-portfolio
  template:
    metadata:
      labels:
        app: me-portfolio
    spec:
      containers:
        - name: me-portfolio
          image: gitea.ramoneees.com/ramon/me-portfolio:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: me-portfolio
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: me-portfolio
  ports:
    - name: http
      port: 80
      targetPort: 80
