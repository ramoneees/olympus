apiVersion: apps/v1
kind: Deployment
metadata:
  name: pack-runner
  namespace: actions-runner
  labels: {app: pack-runner}
spec:
  replicas: 1
  strategy: {type: Recreate}   # single identity; never two runners on one PVC
  selector:
    matchLabels: {app: pack-runner}
  template:
    metadata:
      labels: {app: pack-runner}
    spec:
      nodeSelector:
        kubernetes.io/hostname: olympus
      securityContext:
        fsGroup: 1000
      initContainers:
        # Official image keeps its binaries in /home/runner (the PVC mount).
        # Seed them onto the PVC once; wipe stale identity from the old
        # summerwind registration (GitHub no longer knows that runner).
        - name: bootstrap
          image: ghcr.io/actions/actions-runner:2.337.0
          command: ["bash", "-c"]
          args:
            - |
              if [ ! -d /pvc/bin ]; then
                echo "seeding runner binaries onto PVC"
                cp -a /home/runner/. /pvc/
              fi
              rm -f /pvc/.runner /pvc/.credentials /pvc/.credentials_rsaparams
          volumeMounts:
            - {name: home, mountPath: /pvc}
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:2.337.0
          command: ["bash", "-c"]
          args:
            - |
              cd /home/runner
              if [ ! -f .runner ]; then
                echo "registering ${RUNNER_NAME} for ${RUNNER_REPO}"
                ./config.sh --url "https://github.com/${RUNNER_REPO}" \
                  --token "${RUNNER_TOKEN}" \
                  --name "${RUNNER_NAME}" \
                  --labels "${RUNNER_LABELS}" \
                  --work /home/runner/_work \
                  --unattended --disableupdate
              fi
              exec ./run.sh
          envFrom:
            - secretRef: {name: runner-registration}
          env:
            - name: RUNNER_REPO
              value: "ramoneees/pack"
            - name: RUNNER_NAME
              value: "olympus-pack-1"
            - name: RUNNER_LABELS
              value: "self-hosted,linux,X64,pack-linux"
            - name: RUNNER_WORKDIR
              value: /home/runner/_work
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "4", memory: 10Gi}
          volumeMounts:
            - {name: home, mountPath: /home/runner}
            - {name: docker, mountPath: /var/run/docker.sock}
      volumes:
        - name: home
          persistentVolumeClaim: {claimName: runner-home}
        - name: docker
          hostPath: {path: /var/run/docker.sock}
