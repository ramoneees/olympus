---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archivist-es-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archivist-es
  namespace: apps
  labels:
    app: archivist-es
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: archivist-es
  template:
    metadata:
      labels:
        app: archivist-es
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: archivist-es
          image: bbilly1/tubearchivist-es:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tubearchivist-secret
                  key: elastic-password
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
          ports:
            - name: http
              containerPort: 9200
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: archivist-es-data
---
apiVersion: v1
kind: Service
metadata:
  name: archivist-es
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: archivist-es
  ports:
    - name: http
      port: 9200
      targetPort: 9200
