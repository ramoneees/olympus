---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archivist-redis-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archivist-redis
  namespace: apps
  labels:
    app: archivist-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: archivist-redis
  template:
    metadata:
      labels:
        app: archivist-redis
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: archivist-redis
          image: redis:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: archivist-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: archivist-redis
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: archivist-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
