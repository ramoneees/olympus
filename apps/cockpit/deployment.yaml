# cockpit — API FastAPI + UI React. Os initContainers clonam worklog, lifefeed
# e tenders (URLs via secret cockpit-secret; mesmo token read:repository) para
# emptyDirs que a API lê via COCKPIT_*_REPO. GIT_SSL_NO_VERIFY: o wildcard TLS
# é interino auto-assinado até o cert LE real voltar (cloudflare-api-token).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cockpit
  namespace: apps
  labels:
    app: cockpit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cockpit
  template:
    metadata:
      labels:
        app: cockpit
    spec:
      serviceAccountName: cockpit
      nodeSelector:
        kubernetes.io/hostname: olympus
      initContainers:
        - name: clone-repos
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - |
              apt-get update -qq && apt-get install -y -qq git >/dev/null
              git -c http.sslVerify=false clone --depth 1 "$GITEA_REPO_URL" /worklog
              git -c http.sslVerify=false clone --depth 1 "$GITEA_LIFEFEEED_URL" /lifefeed
              git -c http.sslVerify=false clone --depth 1 "$GITEA_TENDERS_URL" /tenders
          env:
            - name: GITEA_REPO_URL
              valueFrom:
                secretKeyRef:
                  name: cockpit-secret
                  key: gitea-repo-url
            - name: GITEA_LIFEFEEED_URL
              valueFrom:
                secretKeyRef:
                  name: cockpit-secret
                  key: gitea-lifefeed-url
            - name: GITEA_TENDERS_URL
              valueFrom:
                secretKeyRef:
                  name: cockpit-secret
                  key: gitea-tenders-url
          volumeMounts:
            - name: worklog
              mountPath: /worklog
            - name: lifefeed
              mountPath: /lifefeed
            - name: tenders
              mountPath: /tenders
      containers:
        - name: api
          image: git.ramoneees.com/ramoneees/cockpit:v0.6.0
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: COCKPIT_WORKLOG_REPO
              value: /worklog
            - name: COCKPIT_LIFEFEEED_REPO
              value: /lifefeed
            - name: COCKPIT_TENDERS_REPO
              value: /tenders
            - name: GIT_SSL_NO_VERIFY
              value: "1"
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: worklog
              mountPath: /worklog
            - name: lifefeed
              mountPath: /lifefeed
            - name: tenders
              mountPath: /tenders
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: worklog
          emptyDir: {}
        - name: lifefeed
          emptyDir: {}
        - name: tenders
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cockpit
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: cockpit
  ports:
    - name: http
      port: 8787
      targetPort: http
