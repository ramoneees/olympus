# cockpit — Work tab (v1). API reads the worklog repo from a clone kept
# fresh by snapshot.py (per-request fetch + merge --ff-only); the
# initContainer does the initial clone with the token-bearing URL.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cockpit
  namespace: apps
  labels:
    app: cockpit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cockpit
  template:
    metadata:
      labels:
        app: cockpit
    spec:
      nodeSelector:
        kubernetes.io/hostname: olympus
      initContainers:
        - name: clone-worklog
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - |
              apt-get update -qq && apt-get install -y -qq git >/dev/null
              git clone --depth 1 "$GITEA_REPO_URL" /worklog
          env:
            - name: GITEA_REPO_URL
              valueFrom:
                secretKeyRef:
                  name: cockpit-secret
                  key: gitea-repo-url
          volumeMounts:
            - name: worklog
              mountPath: /worklog
      containers:
        - name: api
          image: git.ramoneees.com/ramoneees/cockpit:v0.0.0
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: COCKPIT_WORKLOG_REPO
              value: /worklog
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: worklog
              mountPath: /worklog
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: worklog
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cockpit
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: cockpit
  ports:
    - name: http
      port: 8787
      targetPort: http
