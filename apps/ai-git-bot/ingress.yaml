# Traefik IngressRoute for AI-Git-Bot Web UI
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ai-git-bot
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`reviews.ramoneees.com`)
      kind: Rule
      services:
        - name: ai-git-bot
          port: 8080
  tls:
    secretName: wildcard-ramoneees-com-tls
