# AI-Git-Bot — self-hosted gateway between Git platforms and AI providers
# https://github.com/tmseidel/ai-git-bot
# Docker: tmseidel/ai-git-bot:1.6.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-git-bot
  namespace: apps
  labels:
    app: ai-git-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-git-bot
  template:
    metadata:
      labels:
        app: ai-git-bot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: ai-git-bot
          image: git.ramoneees.com/ramoneees/ai-git-bot:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-git-bot-secret
                  key: database-url
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ai-git-bot-secret
                  key: database-username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-git-bot-secret
                  key: database-password
            - name: APP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-git-bot-secret
                  key: app-encryption-key
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          # Do NOT override entrypoint — Dockerfile ENTRYPOINT includes
          # -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 and
          # --spring.profiles.active=docker
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-git-bot
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: ai-git-bot
  ports:
    - name: http
      port: 8080
      targetPort: 8080
