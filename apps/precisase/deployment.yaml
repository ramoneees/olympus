---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: precisase-uploads
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: precisase-web
  namespace: apps
  labels:
    app: precisase-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: precisase-web
  template:
    metadata:
      labels:
        app: precisase-web
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: db-migrate
          image: git.ramoneees.com/ramoneees/precisase:latest
          imagePullPolicy: Always
          command: ["node_modules/.bin/prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: precisase-secret
                  key: database-url
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: precisase
          image: git.ramoneees.com/ramoneees/precisase:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: precisase-secret
                  key: database-url
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: precisase-secret
                  key: auth-secret
            # AUTH_URL intentionally omitted: when set together with the
            # `auth()` middleware wrapper (next-auth v5 beta) + next-intl
            # middleware, the next-intl rewrite target becomes an absolute
            # URL with AUTH_URL's origin (e.g. `https://precisase.../pt-PT`)
            # which the standalone Next.js server can't internally route,
            # resulting in `no available server` 503 on every locale-aware
            # route. With `AUTH_TRUST_HOST=true` below, next-auth derives
            # the canonical URL from the actual incoming request at runtime
            # (Traefik terminates TLS and forwards via HTTPS), so cookies
            # stay `__Secure-` prefixed and correct.
            - name: APP_URL
              value: "https://precisase.ramoneees.com"
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: CONTACT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: precisase-secret
                  key: contact-encryption-key
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: precisase-secret
                  key: resend-api-key
            - name: RESEND_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: precisase-secret
                  key: resend-from-email
          volumeMounts:
            - name: uploads
              mountPath: /app/public/uploads
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: precisase-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: precisase-web
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: precisase-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
