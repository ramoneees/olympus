---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pack-website
  namespace: apps
  labels:
    app: pack-website
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pack-website
  template:
    metadata:
      labels:
        app: pack-website
      annotations:
        # Reloader will roll the pod when the ConfigMap changes
        reloader.stakater.com/auto: "true"
        # Force a new rollout when content changes (extra safety net)
        kustomize.toolkit.fluxcd.io/force: "false"
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: content
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: pack-website-content
            items:
              - key: nginx.conf
                path: nginx.conf
              - key: index.html
                path: index.html
              - key: privacy.html
                path: privacy.html
              - key: support.html
                path: support.html
              - key: well-known-apple-app-site-association
                path: .well-known/apple-app-site-association
              - key: well-known-assetlinks-json
                path: .well-known/assetlinks.json
