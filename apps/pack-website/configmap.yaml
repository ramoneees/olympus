  # Apple App Site Association (Universal Links).
  # Replace TEAMID once the Apple Developer account is created.
  # Must be served at exactly /.well-known/apple-app-site-association with
  # Content-Type: application/json (handled by nginx.conf above).
  # Ref: https://developer.apple.com/documentation/bundleresources/apple-app-site-association
  well-known-apple-app-site-association: |
    {
      "applinks": {
        "details": [
          {
            "appIDs": ["TEAMID.com.pack.app"],
            "components": [
              { "/": "/*" }
            ]
          }
        ]
      }
    }

  # Google Digital Asset Links (Android App Links verification).
  # Replace the SHA-256 fingerprint once the Android app is signed.
  # Ref: https://developer.android.com/training/app-links/verify-android-links
  well-known-assetlinks-json: |
    [
      {
        "relation": ["delegate_permission/common.handle_all_urls"],
        "target": {
          "namespace": "android_app",
          "package_name": "com.pack.app",
          "sha256_cert_fingerprints": [
            "REPLACE_WITH_ANDROID_SIGNING_CERT_SHA256"
          ]
        }
      }
    ]
