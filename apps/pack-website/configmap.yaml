  privacy.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Privacy Policy — Pack</title>
      <meta name="description" content="Pack does not collect, store, or transmit personal data. All file processing happens on your device.">
      <link rel="canonical" href="https://packapp.ramoneees.com/privacy.html">
      <style>
        :root {
          --ink: #141A2A; --ink-2: #565E74; --ink-3: #8B92A6;
          --accent: #3B5BF5; --accent-soft: #ECEFFE;
          --bg: #FFFFFF; --panel: #F6F7FB; --hairline: #E8EAF1;
          --navy: #0C1120; --success: #16A06A;
        }
        html, body { margin: 0; padding: 0; background: var(--bg); -webkit-font-smoothing: antialiased; }
        * { box-sizing: border-box; }
        a { color: var(--accent); }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
          color: var(--ink); line-height: 1.6;
        }
        .nav {
          position: sticky; top: 0; z-index: 20;
          background: rgba(255,255,255,0.82);
          backdrop-filter: saturate(180%) blur(14px);
          -webkit-backdrop-filter: saturate(180%) blur(14px);
          border-bottom: 1px solid var(--hairline);
        }
        .nav-inner {
          max-width: 1120px; margin: 0 auto;
          padding: 14px 28px;
          display: flex; align-items: center; justify-content: space-between;
        }
        .brand { display: flex; align-items: center; gap: 11px; color: inherit; text-decoration: none; }
        .brand-mark {
          width: 32px; height: 32px; border-radius: 9px;
          background: var(--accent);
          display: flex; align-items: center; justify-content: center;
          box-shadow: 0 4px 14px rgba(59,91,245,0.35);
        }
        .brand-name { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
        .nav-back {
          font-size: 15px; font-weight: 500; color: var(--ink-2);
        }
        .container { max-width: 720px; margin: 0 auto; padding: 32px 28px 96px; }
        h1 { font-size: clamp(28px, 4vw, 36px); font-weight: 800; letter-spacing: -0.02em; margin: 32px 0 8px; }
        .updated { color: var(--ink-3); font-size: 14px; margin-bottom: 32px; }
        h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 36px 0 12px; }
        p { margin-bottom: 16px; }
        ul { margin: 0 0 16px 22px; }
        li { margin-bottom: 8px; }
        .callout {
          background: var(--accent-soft);
          border-radius: 14px;
          padding: 20px 22px;
          margin: 24px 0;
          border-left: 4px solid var(--accent);
        }
        .callout strong { color: var(--ink); }
      </style>
    </head>
    <body>
      <div class="nav">
        <div class="nav-inner">
          <a href="/" class="brand">
            <span class="brand-mark">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
            </span>
            <span class="brand-name">Pack</span>
          </a>
          <a href="/" class="nav-back">&larr; Back to site</a>
        </div>
      </div>
      <div class="container">
        <h1>Privacy Policy</h1>
        <p class="updated">Last updated: June 2026</p>

        <p>Pack is designed around a simple principle: <strong>your files never leave your device.</strong></p>

        <div class="callout">
          <strong>The short version:</strong> Pack does not collect, store, or transmit any personal data. All file processing happens entirely on your device. No analytics. No tracking. No account required.
        </div>

        <h2>Data collection</h2>
        <p>Pack does not collect, store, or transmit any personal data.</p>
        <ul>
          <li>All file processing happens entirely on your device.</li>
          <li>No data is sent to any servers or third parties.</li>
          <li>No analytics, telemetry, or tracking of any kind.</li>
          <li>No account or registration required.</li>
        </ul>

        <h2>Permissions</h2>
        <p>Pack requests the following permissions to provide its core functionality:</p>
        <ul>
          <li><strong>Photo Library</strong> — to access the photos and videos you select for compression. You explicitly choose files via iOS's native picker; Pack only sees what you pick. Files are processed locally and never leave your device.</li>
          <li><strong>Files (Documents)</strong> — to access files from the Files app. Same model: you explicitly pick, Pack processes locally.</li>
          <li><strong>Local Network</strong> — for optional direct device-to-device transfer over Wi-Fi (MultipeerConnectivity). This is opt-in; nothing happens unless you start a transfer.</li>
        </ul>

        <h2>Third-party services</h2>
        <ul>
          <li><strong>Google AdMob</strong> — if you are shown an ad on the free tier, the Google Mobile Ads SDK may collect device identifiers for advertising purposes. You can control this through iOS Settings &gt; Privacy &amp; Security &gt; Tracking &gt; Pack.</li>
          <li><strong>App Store &amp; StoreKit</strong> — if you purchase Pack Pro, Apple's standard App Store privacy practices apply. See <a href="https://www.apple.com/legal/privacy/en-ww/" target="_blank" rel="noopener">Apple's Privacy Policy</a>.</li>
        </ul>

        <h2>Children's privacy</h2>
        <p>Pack is not intended for use by children under 13. We do not knowingly collect data from children.</p>

        <h2>Your rights</h2>
        <p>Because Pack stores no personal data, there is nothing to access, correct, export, or delete. iOS's standard permission controls (Settings &gt; Pack) let you revoke Photo or Local Network access at any time.</p>

        <h2>Changes to this policy</h2>
        <p>If this policy is updated, the "Last updated" date above will be revised.</p>

        <h2>Contact</h2>
        <p>For privacy questions, contact <a href="mailto:ramon@pereirariosoftware.com">ramon@pereirariosoftware.com</a>.</p>
      </div>
    </body>
    </html>

