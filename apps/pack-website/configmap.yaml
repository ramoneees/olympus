# Pack website static content — served by nginx:alpine via ConfigMap mount.
# Design source: Claude Design "Pack Website.dc.html" handoff (June 2026).
# Update content here, commit, Flux syncs within ~10 min, Reloader restarts the pod.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pack-website-content
  namespace: apps
  labels:
    app: pack-website
data:
  nginx.conf: |
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # gzip — small wins for text payloads
        gzip on;
        gzip_vary on;
        gzip_min_length 256;
        gzip_types
            text/plain
            text/css
            text/xml
            application/json
            application/javascript
            application/xml+rss
            image/svg+xml;

        # Extensionless URLs: /privacy -> /privacy.html, /support -> /support.html
        try_files $uri $uri.html $uri/ =404;

        # Apple AASA — must be served as application/json, no redirect, at exactly this path.
        # https://developer.apple.com/documentation/bundleresources/apple-app-site-association
        location = /.well-known/apple-app-site-association {
            default_type application/json;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # Google Digital Asset Links — same content-type rule.
        # https://developer.android.com/training/app-links/verify-android-links
        location = /.well-known/assetlinks.json {
            default_type application/json;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # Reasonable default cache for the rest
        location ~* \.(html|css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
            add_header Cache-Control "public, max-age=3600, must-revalidate";
        }

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Pack — Shrink files. Share anywhere.</title>
      <meta name="description" content="Pack makes your photos and videos smaller and easier to send — entirely on your iPhone. No cloud, no account, nothing uploaded.">
      <meta name="theme-color" content="#ffffff">
      <meta property="og:title" content="Pack — Shrink files. Share anywhere.">
      <meta property="og:description" content="Compress and convert photos, videos, and audio — entirely on your device. Pack runs no servers and uploads nothing.">
      <meta property="og:type" content="website">
      <meta property="og:url" content="https://packapp.ramoneees.com/">
      <link rel="canonical" href="https://packapp.ramoneees.com/">
      <meta name="google-site-verification" content="OwvQ6K4BV6OZZyuK63r8vOq7ukE-sqOZfRqhGFDkwoY" />
      <style>
        :root {
          --ink: #141A2A;
          --ink-2: #565E74;
          --ink-3: #8B92A6;
          --accent: #3B5BF5;
          --accent-press: #2E49CC;
          --accent-soft: #ECEFFE;
          --bg: #FFFFFF;
          --panel: #F6F7FB;
          --hairline: #E8EAF1;
          --navy: #0C1120;
          --success: #16A06A;
          --success-soft: #E2F4EC;
        }
        html, body {
          margin: 0; padding: 0;
          background: var(--bg);
          -webkit-font-smoothing: antialiased;
        }
        * { box-sizing: border-box; }
        a { color: inherit; text-decoration: none; }
        ::selection { background: var(--accent-soft); }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
          color: var(--ink);
          line-height: 1.5;
        }
        .wrap { max-width: 1120px; margin: 0 auto; padding: 0 28px; }

        /* Nav */
        .nav {
          position: sticky; top: 0; z-index: 20;
          background: rgba(255,255,255,0.82);
          backdrop-filter: saturate(180%) blur(14px);
          -webkit-backdrop-filter: saturate(180%) blur(14px);
          border-bottom: 1px solid var(--hairline);
        }
        .nav-inner {
          display: flex; align-items: center; justify-content: space-between;
          gap: 20px; padding: 14px 0;
        }
        .brand { display: flex; align-items: center; gap: 11px; }
        .brand-mark {
          width: 32px; height: 32px; border-radius: 9px;
          background: var(--accent);
          display: flex; align-items: center; justify-content: center;
          box-shadow: 0 4px 14px rgba(59,91,245,0.35);
        }
        .brand-name { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
        .nav-links {
          display: flex; align-items: center; gap: 30px;
          font-size: 15px; font-weight: 500; color: var(--ink-2);
        }
        .nav-links a:hover { color: var(--ink); }
        .nav-cta {
          display: inline-flex; align-items: center; gap: 7px;
          background: var(--ink); color: #fff;
          padding: 9px 16px; border-radius: 11px; font-weight: 600;
        }
        .nav-cta:hover { background: var(--navy); }

        /* Hero */
        .hero {
          padding: 72px 0 40px;
          display: grid;
          grid-template-columns: 1.05fr 0.95fr;
          gap: 48px;
          align-items: center;
        }
        .pill {
          display: inline-flex; align-items: center; gap: 8px;
          background: var(--accent-soft); color: var(--accent);
          padding: 7px 14px; border-radius: 999px;
          font-size: 13px; font-weight: 600;
          margin-bottom: 22px;
        }
        .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
        .hero h1 {
          margin: 0;
          font-size: clamp(40px, 5vw, 60px);
          line-height: 1.04;
          font-weight: 800;
          letter-spacing: -0.03em;
        }
        .hero p.lede {
          margin: 22px 0 0;
          font-size: 19px;
          line-height: 1.5;
          color: var(--ink-2);
          max-width: 460px;
        }
        .hero-ctas {
          margin-top: 34px;
          display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        }
        .app-store-btn {
          display: inline-flex; align-items: center; gap: 11px;
          background: var(--ink); color: #fff;
          padding: 14px 22px; border-radius: 14px;
          font-size: 16px; font-weight: 600;
        }
        .app-store-btn:hover { background: var(--navy); }
        .app-store-btn .stack {
          display: flex; flex-direction: column;
          line-height: 1.15; text-align: left;
        }
        .app-store-btn .stack .small { font-size: 11px; font-weight: 500; opacity: 0.8; }
        .app-store-btn .stack .big { font-size: 18px; font-weight: 600; }
        .hero-note { font-size: 14px; color: var(--ink-3); font-weight: 500; }

        /* iPhone mockup */
        .phone-wrap { display: flex; justify-content: center; }
        .phone {
          width: 300px; height: 610px;
          background: #05060A;
          border-radius: 46px;
          padding: 9px;
          box-shadow: 0 40px 80px rgba(20,26,42,0.22), 0 0 0 1px rgba(20,26,42,0.06);
        }
        .phone-inner {
          width: 100%; height: 100%;
          background: #fff;
          border-radius: 38px;
          overflow: hidden;
          display: flex; flex-direction: column;
          position: relative;
        }
        .phone-notch {
          position: absolute; top: 9px; left: 50%;
          transform: translateX(-50%);
          width: 98px; height: 27px;
          background: #000; border-radius: 16px;
        }
        .phone-status {
          height: 46px; flex-shrink: 0;
          display: flex; align-items: flex-end; justify-content: space-between;
          padding: 0 24px 7px;
          font-size: 13px; font-weight: 600; color: var(--ink);
        }
        .phone-screen {
          flex: 1;
          display: flex; flex-direction: column;
          padding: 18px 22px 0;
        }
        .done-wrap {
          display: flex; flex-direction: column; align-items: center; gap: 14px;
          margin-top: 14px;
        }
        .done-check {
          width: 60px; height: 60px; border-radius: 50%;
          background: var(--success);
          display: flex; align-items: center; justify-content: center;
          color: #fff;
        }
        .done-title {
          font-size: 27px; font-weight: 700; letter-spacing: -0.02em;
        }
        .size-card {
          margin-top: 22px;
          background: var(--panel);
          border-radius: 18px;
          padding: 20px;
          display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .size-row {
          display: flex; align-items: center; gap: 10px;
          font-size: 21px; font-weight: 700;
          font-variant-numeric: tabular-nums;
          letter-spacing: -0.01em;
          white-space: nowrap;
        }
        .size-row .arrow { color: var(--ink-3); }
        .smaller-pill {
          display: inline-flex; align-items: center; gap: 6px;
          background: var(--success-soft); color: var(--success);
          padding: 6px 13px; border-radius: 999px;
          font-size: 14px; font-weight: 700;
        }
        .device-note {
          display: flex; align-items: center; gap: 7px;
          padding-top: 12px;
          border-top: 1px solid var(--hairline);
          width: 100%; justify-content: center;
          color: var(--ink-2);
          font-size: 12px; font-weight: 500;
        }
        .phone-actions {
          margin-top: 16px;
          display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .phone-action {
          height: 46px; border-radius: 13px;
          display: flex; align-items: center; justify-content: center; gap: 7px;
          font-size: 15px; font-weight: 600;
        }
        .phone-action.secondary { background: var(--panel); color: var(--accent); }
        .phone-action.primary { background: var(--accent); color: #fff; }

        /* Trust strip */
        .trust {
          margin-top: 24px;
          padding: 22px 0;
          border-top: 1px solid var(--hairline);
          border-bottom: 1px solid var(--hairline);
        }
        .trust-inner {
          display: flex; flex-wrap: wrap; gap: 14px 40px; justify-content: center;
        }
        .trust-item {
          display: inline-flex; align-items: center; gap: 8px;
          font-size: 14px; font-weight: 600; color: var(--ink-2);
        }
        .trust-item .check { color: var(--success); display: flex; }

        /* Section heads */
        .section { padding: 80px 0 20px; text-align: center; }
        .section.tight { padding-top: 72px; }
        .eyebrow {
          font-size: 13px; font-weight: 700;
          letter-spacing: 0.08em; text-transform: uppercase;
          color: var(--accent);
        }
        .section h2 {
          margin: 12px 0 0;
          font-size: clamp(28px, 3.4vw, 40px);
          font-weight: 800; letter-spacing: -0.025em;
        }
        .section h2.left { text-align: left; }
        .section p.lede-center {
          margin: 14px auto 0;
          font-size: 17px;
          color: var(--ink-2);
          max-width: 520px;
        }

        /* Cards (How it works / Features) */
        .grid-3 {
          margin-top: 48px;
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 20px;
          text-align: left;
        }
        .card {
          background: var(--panel);
          border: 1px solid var(--hairline);
          border-radius: 20px;
          padding: 26px;
        }
        .card.outlined { background: var(--bg); }
        .card .step {
          font-size: 13px; font-weight: 700; color: var(--accent);
        }
        .card h3 {
          margin: 12px 0 0;
          font-size: 20px; font-weight: 700; letter-spacing: -0.01em;
        }
        .card h3.tight { font-size: 18px; }
        .card p {
          margin: 8px 0 0;
          font-size: 15px; line-height: 1.5; color: var(--ink-2);
        }
        .card .icon-tile {
          width: 48px; height: 48px; border-radius: 13px;
          background: var(--accent-soft); color: var(--accent);
          display: flex; align-items: center; justify-content: center;
        }

        /* Privacy band (dark navy) */
        .privacy-band {
          margin-top: 80px;
          background: var(--navy);
          color: #fff;
        }
        .privacy-band-inner {
          max-width: 1120px;
          margin: 0 auto;
          padding: 80px 28px;
        }
        .privacy-band .eyebrow { color: #8FA0FF; }
        .privacy-band h2 {
          margin: 14px 0 0;
          font-size: clamp(28px, 3.6vw, 42px);
          font-weight: 800; letter-spacing: -0.025em; line-height: 1.1;
          text-align: left;
        }
        .privacy-band p {
          margin: 18px 0 0;
          font-size: 18px; line-height: 1.55; color: #B9C0D4;
          max-width: 640px;
        }
        .privacy-grid {
          margin-top: 44px;
          display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px;
        }
        .privacy-card {
          background: rgba(255,255,255,0.05);
          border: 1px solid rgba(255,255,255,0.10);
          border-radius: 18px;
          padding: 24px;
        }
        .privacy-card .icon-tile-dark {
          width: 40px; height: 40px; border-radius: 11px;
          background: rgba(143,160,255,0.18); color: #A7B4FF;
          display: flex; align-items: center; justify-content: center;
        }
        .privacy-card h3 {
          margin: 16px 0 0; font-size: 17px; font-weight: 700;
        }
        .privacy-card p {
          margin: 7px 0 0; font-size: 14px; line-height: 1.5; color: #A6AEC4;
        }

        /* Pricing */
        .pricing-grid {
          margin-top: 46px;
          display: grid;
          grid-template-columns: 1.1fr 1fr 1fr;
          gap: 20px;
          text-align: left;
          align-items: stretch;
        }
        .price-card {
          border: 1px solid var(--hairline);
          border-radius: 22px;
          padding: 30px;
          display: flex; flex-direction: column;
        }
        .price-card.featured {
          border: 2px solid var(--accent);
          position: relative;
          box-shadow: 0 18px 50px rgba(59,91,245,0.16);
        }
        .price-card.featured .ribbon {
          position: absolute; top: -12px; left: 30px;
          background: var(--accent); color: #fff;
          font-size: 12px; font-weight: 700;
          padding: 5px 12px; border-radius: 999px;
        }
        .price-card .tier { font-size: 15px; font-weight: 700; }
        .price-card .tier.muted { color: var(--ink-2); }
        .price-card .tier.accent { color: var(--accent); }
        .price-card .price {
          margin-top: 10px;
          font-size: 40px; font-weight: 800; letter-spacing: -0.02em;
        }
        .price-card .price .unit {
          font-size: 16px; font-weight: 600; color: var(--ink-3);
        }
        .price-card .caption { font-size: 14px; color: var(--ink-3); }
        .price-card hr {
          border: 0; height: 1px; background: var(--hairline);
          margin: 22px 0;
        }
        .price-card ul {
          list-style: none; padding: 0; margin: 0;
          display: flex; flex-direction: column; gap: 12px;
          font-size: 15px; color: var(--ink-2);
        }
        .price-card ul li { display: flex; gap: 9px; }
        .price-card ul li .tick { color: var(--success); flex-shrink: 0; }
        .price-card ul li .dot { color: var(--ink-3); flex-shrink: 0; }
        .price-card .cta-btn {
          margin-top: 26px; text-align: center;
          background: var(--panel); color: var(--ink);
          padding: 13px; border-radius: 13px;
          font-size: 15px; font-weight: 600;
        }
        .price-card.featured .cta-btn {
          background: var(--accent); color: #fff;
        }
        .price-card .cta-btn:hover { background: var(--accent-soft); }
        .price-card.featured .cta-btn:hover { background: var(--accent-press); }
        .pricing-fineprint {
          margin-top: 20px; font-size: 13px; color: var(--ink-3);
        }

        /* Big CTA */
        .big-cta-wrap { padding: 64px 0 0; }
        .big-cta {
          background: var(--accent);
          border-radius: 28px;
          padding: 56px 40px;
          text-align: center;
          color: #fff;
        }
        .big-cta h2 {
          margin: 0;
          font-size: clamp(26px, 3.2vw, 38px);
          font-weight: 800; letter-spacing: -0.02em;
        }
        .big-cta p {
          margin: 14px auto 0;
          font-size: 17px;
          color: rgba(255,255,255,0.85);
          max-width: 440px;
        }
        .big-cta .app-store-btn {
          margin-top: 28px;
          background: #fff; color: var(--ink);
        }
        .big-cta .app-store-btn:hover { background: #f6f7fb; }

        /* Footer */
        footer.footer {
          padding: 56px 0 64px;
        }
        .footer-grid {
          display: flex; flex-wrap: wrap; gap: 24px;
          justify-content: space-between; align-items: flex-start;
          border-top: 1px solid var(--hairline);
          padding-top: 36px;
        }
        .footer-brand .brand-mark { width: 28px; height: 28px; border-radius: 8px; }
        .footer-brand p {
          margin: 14px 0 0;
          font-size: 14px; color: var(--ink-3);
          max-width: 280px; line-height: 1.5;
        }
        .footer-cols {
          display: flex; gap: 64px; flex-wrap: wrap;
        }
        .footer-col {
          display: flex; flex-direction: column; gap: 11px;
          font-size: 14px; color: var(--ink-2);
        }
        .footer-col .h {
          font-size: 12px; font-weight: 700;
          text-transform: uppercase; letter-spacing: 0.06em;
          color: var(--ink-3);
        }
        .footer-col a:hover { color: var(--ink); }
        .copyright {
          margin-top: 36px; font-size: 13px; color: var(--ink-3);
        }

        /* Responsive */
        @media (max-width: 920px) {
          .hero { grid-template-columns: 1fr; gap: 36px; padding: 48px 0 24px; }
          .phone-wrap { order: -1; }
          .grid-3 { grid-template-columns: 1fr; }
          .privacy-grid { grid-template-columns: 1fr; }
          .pricing-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
          .nav-links { gap: 14px; font-size: 14px; }
          .nav-links .nav-cta { padding: 8px 12px; }
          .nav-links .hide-sm { display: none; }
          .section { padding: 56px 0 12px; }
          .privacy-band-inner { padding: 56px 24px; }
          .big-cta { padding: 40px 24px; }
          .footer-cols { gap: 36px; }
        }
      </style>
    </head>
    <body>

      <!-- NAV -->
      <div class="nav">
        <div class="wrap nav-inner">
          <a href="/" class="brand">
            <span class="brand-mark">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
            </span>
            <span class="brand-name">Pack</span>
          </a>
          <nav class="nav-links">
            <a href="#features" class="hide-sm">Features</a>
            <a href="#privacy" class="hide-sm">Privacy</a>
            <a href="#pricing" class="hide-sm">Pricing</a>
            <a href="#hero-cta" class="nav-cta">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .7 1.1 1.6 2.3 2.8 2.3 1.1 0 1.5-.7 2.9-.7 1.3 0 1.7.7 2.9.7 1.2 0 2-1.1 2.7-2.2.9-1.3 1.2-2.5 1.2-2.6 0 0-2.3-.9-2.3-3.5zM14.1 5.9c.6-.8 1-1.8.9-2.9-.9 0-2 .6-2.6 1.3-.6.7-1.1 1.7-1 2.8 1 .1 2-.5 2.7-1.2z"/></svg>
              App Store
            </a>
          </nav>
        </div>
      </div>

      <!-- HERO -->
      <div class="wrap hero">
        <div>
          <span class="pill">
            <span class="dot"></span>
            Private by design · 100% on-device
          </span>
          <h1>Shrink files.<br>Share anywhere.</h1>
          <p class="lede">Pack makes your photos and videos smaller and easier to send — entirely on your iPhone. No cloud, no account, nothing uploaded.</p>
          <div class="hero-ctas" id="hero-cta">
            <a href="#" class="app-store-btn">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .7 1.1 1.6 2.3 2.8 2.3 1.1 0 1.5-.7 2.9-.7 1.3 0 1.7.7 2.9.7 1.2 0 2-1.1 2.7-2.2.9-1.3 1.2-2.5 1.2-2.6 0 0-2.3-.9-2.3-3.5zM14.1 5.9c.6-.8 1-1.8.9-2.9-.9 0-2 .6-2.6 1.3-.6.7-1.1 1.7-1 2.8 1 .1 2-.5 2.7-1.2z"/></svg>
              <span class="stack">
                <span class="small">Download on the</span>
                <span class="big">App Store</span>
              </span>
            </a>
            <span class="hero-note">Free · No account · No tracking</span>
          </div>
        </div>

        <!-- iPhone mockup: success payoff -->
        <div class="phone-wrap">
          <div class="phone">
            <div class="phone-inner">
              <div class="phone-notch"></div>
              <div class="phone-status">
                <span>9:41</span>
                <span style="display:flex;gap:5px;align-items:center;">
                  <svg width="15" height="10" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="0.6" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="0.6" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="0.6" fill="currentColor"/><rect x="15" y="0.5" width="3" height="11.5" rx="0.6" fill="currentColor"/></svg>
                  <svg width="20" height="11" viewBox="0 0 26 14"><rect x="0.5" y="0.5" width="22" height="13" rx="3.5" fill="none" stroke="currentColor" stroke-opacity="0.4"/><rect x="2" y="2" width="19" height="10" rx="2" fill="currentColor"/></svg>
                </span>
              </div>
              <div class="phone-screen">
                <div class="done-wrap">
