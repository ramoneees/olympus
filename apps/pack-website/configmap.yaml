            <hr>
            <ul>
              <li><span class="tick">&#10003;</span>All Pro features</li>
              <li><span class="tick">&#10003;</span>No subscription</li>
              <li><span class="tick">&#10003;</span>Future updates included</li>
              <li><span class="dot">·</span>Also available weekly at $0.99</li>
            </ul>
            <a href="#" class="cta-btn">Buy lifetime</a>
          </div>
        </div>
        <p class="pricing-fineprint">All purchases are handled by the App Store. We never see your card details.</p>
      </div>

      <!-- BIG CTA -->
      <div class="wrap big-cta-wrap">
        <div class="big-cta">
          <h2>Make your next file sendable.</h2>
          <p>Free to download. Nothing leaves your phone. No account required.</p>
          <a href="#" class="app-store-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .7 1.1 1.6 2.3 2.8 2.3 1.1 0 1.5-.7 2.9-.7 1.3 0 1.7.7 2.9.7 1.2 0 2-1.1 2.7-2.2.9-1.3 1.2-2.5 1.2-2.6 0 0-2.3-.9-2.3-3.5zM14.1 5.9c.6-.8 1-1.8.9-2.9-.9 0-2 .6-2.6 1.3-.6.7-1.1 1.7-1 2.8 1 .1 2-.5 2.7-1.2z"/></svg>
            <span class="stack">
              <span class="small">Download on the</span>
              <span class="big">App Store</span>
