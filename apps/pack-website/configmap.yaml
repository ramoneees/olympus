          </div>
        </div>
      </div>

      <!-- HOW IT WORKS -->
      <div class="wrap section">
        <div class="eyebrow">Three taps</div>
        <h2>No codecs. No settings. No guesswork.</h2>
        <div class="grid-3">
          <div class="card">
            <div class="step">01</div>
            <h3>Pick a file</h3>
            <p>Choose any photo, video, or audio file from your library or Files.</p>
          </div>
          <div class="card">
            <div class="step">02</div>
            <h3>Choose where it's going</h3>
            <p>WhatsApp, email, Android, or smallest size. Pack picks the right settings — and shows the size before you commit.</p>
          </div>
          <div class="card">
            <div class="step">03</div>
            <h3>Save or share</h3>
            <p>See exactly how much smaller it got, then send it on. Done in seconds.</p>
          </div>
        </div>
      </div>

      <!-- FEATURES -->
      <div id="features" class="wrap section tight">
        <h2>Everything you need to make a file sendable.</h2>
        <div class="grid-3">
          <div class="card outlined">
            <div class="icon-tile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7H6a2 2 0 0 0-2 2v2"/><path d="M4 13v2a2 2 0 0 0 2 2h2"/><path d="M16 7h2a2 2 0 0 1 2 2v2"/><path d="M20 13v2a2 2 0 0 1-2 2h-2"/><path d="M9 12h6"/></svg></div>
            <h3 class="tight">Compress photos &amp; videos</h3>
            <p>Big files become small ones, with quality you control. Powered by your iPhone's own hardware.</p>
          </div>
          <div class="card outlined">
            <div class="icon-tile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l4-4 4 4"/><path d="M8 4v9a3 3 0 0 0 3 3h2"/><path d="M20 16l-4 4-4-4"/></svg></div>
            <h3 class="tight">Convert any format</h3>
            <p>AVI, MKV, WMV, FLV and VP9 to MP4. M4A and WAV to MP3 or AAC. Plays everywhere.</p>
          </div>
          <div class="card outlined">
            <div class="icon-tile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-3z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg></div>
            <h3 class="tight">Strip private metadata</h3>
            <p>Remove EXIF and GPS location data before you share, so a photo doesn't reveal where you were.</p>
          </div>
          <div class="card outlined">
            <div class="icon-tile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M9 14h6M9 17h4"/></svg></div>
            <h3 class="tight">Photos into a PDF</h3>
            <p>Turn a stack of photos into a single clean PDF — perfect for receipts and documents.</p>
          </div>
          <div class="card outlined">
            <div class="icon-tile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a8 8 0 0 1 16 0"/><path d="M4 13a8 8 0 0 0 16 0"/><circle cx="12" cy="10" r="1.4" fill="currentColor"/></svg></div>
            <h3 class="tight">Send over local Wi-Fi</h3>
            <p>Beam a file straight to a nearby device on the same network — no internet required.</p>
          </div>
          <div class="card outlined">
            <div class="icon-tile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M6 7v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M10 11v5M14 11v5"/></svg></div>
            <h3 class="tight">Free up storage</h3>
            <p>Find leftover temporary files quietly eating your space and clear them in one tap.</p>
          </div>
        </div>
      </div>

      <!-- PRIVACY BAND -->
      <div id="privacy" class="privacy-band">
        <div class="privacy-band-inner">
          <div>
            <div class="eyebrow">Privacy isn't a setting</div>
            <h2>Your files never leave your phone.</h2>
            <p>Most "compress online" tools upload your private photos to a server you've never heard of. Pack doesn't. There's no server to upload to — and you can prove it.</p>
          </div>
          <div class="privacy-grid">
            <div class="privacy-card">
              <div class="icon-tile-dark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg></div>
              <h3>Processed on-device</h3>
              <p>Every file is handled by your iPhone's own chip. Nothing is sent anywhere.</p>
            </div>
            <div class="privacy-card">
              <div class="icon-tile-dark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12a10 10 0 0 1 20 0"/><line x1="4" y1="4" x2="20" y2="20"/></svg></div>
