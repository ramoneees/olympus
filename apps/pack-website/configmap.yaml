        <h1>Support</h1>
        <p class="lede">Quick answers and how to reach us.</p>

        <div class="contact">
          <h2>Email us</h2>
          <p>Questions, bugs, feature ideas — we read everything.</p>
          <a href="mailto:ramon@pereirariosoftware.com" class="button">ramon@pereirariosoftware.com</a>
        </div>

        <h2>Common questions</h2>

        <details>
          <summary>Do my files leave my device?</summary>
          <p>No. Pack processes every photo, video, and audio file entirely on your device. Pack runs no servers and uploads nothing.</p>
        </details>

        <details>
          <summary>Why is a file not getting smaller?</summary>
          <p>Files that are already compressed (JPEGs at low quality, MP4s at low bitrate) have little headroom. Pack will show you the before/after size so you can decide whether to proceed. For photos, try a lower target quality; for video, try a lower resolution or higher compression preset.</p>
        </details>

        <details>
          <summary>Can I convert AVI, MKV, or WMV to MP4?</summary>
          <p>Yes. Pack supports AVI, MKV, WMV, FLV, and VP9 video to MP4, and M4A/WAV audio to MP3 or AAC.</p>
        </details>

        <details>
          <summary>How do I remove EXIF / location metadata?</summary>
          <p>Pack removes EXIF and location metadata automatically based on the destination preset. Choose "Send to Android" or "Archive" to strip metadata; choose "Save to Files" to keep it.</p>
        </details>

        <details>
          <summary>What does Pack Pro include?</summary>
          <p>Pack Pro removes the daily compression limit, adds batch processing, PDF generation, advanced presets, nearby transfer, and removes ads. Weekly ($0.99), yearly ($9.99), and lifetime ($29.99) tiers are available — pick whichever fits your use.</p>
        </details>

        <details>
          <summary>How do I transfer files between two devices?</summary>
          <p>Use "Nearby transfer" on both devices, on the same Wi-Fi network. Pack uses MultipeerConnectivity to send files directly — no internet required, no server in the middle.</p>
        </details>

        <h2>Privacy</h2>
        <p>See the <a href="/privacy.html">Privacy Policy</a> for full details.</p>
      </div>
