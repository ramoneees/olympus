      <div id="pricing" class="wrap section">
        <h2>Free to start. Pro when you need it.</h2>
        <p class="lede-center">Compress and convert for free. Pack Pro removes the daily limit, ads, and unlocks batch, PDF, and nearby transfer.</p>
