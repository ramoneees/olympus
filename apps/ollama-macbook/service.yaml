# ollama-macbook — ollama running OUTSIDE the cluster, on Ramon's MacBook Pro
# (192.168.50.13:11434).
#
# Pattern (copied from apps/ollama-mac): Service WITHOUT a selector + a
# hand-managed Endpoints object. No selector means Kubernetes leaves the
# Endpoints exactly as written, pointing at the external LAN IP.
# LiteLLM (olympus ns) reaches it at http://ollama-macbook.olympus.svc:11434/v1.
#
# If the MacBook's LAN IP changes (DHCP), update the address below.
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-macbook
  namespace: olympus
  labels:
    app: ollama-macbook
spec:
  # No selector on purpose — see header comment.
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama-macbook
  namespace: olympus
  labels:
    app: ollama-macbook
subsets:
  - addresses:
      - ip: 192.168.50.13
    ports:
      - name: http
        port: 11434
        protocol: TCP
