# ollama-macbook — ollama running OUTSIDE the cluster, on Ramon's MacBook Pro.
# Reached via the home-router WireGuard tunnel IP (10.6.0.2:11434) — stable
# regardless of which physical network the MacBook sits on (LAN or remote+VPN).
#
# Pattern (copied from apps/ollama-mac): Service WITHOUT a selector + a
# hand-managed Endpoints object. No selector means Kubernetes leaves the
# Endpoints exactly as written, pointing at the tunnel IP.
# LiteLLM (olympus ns) reaches it at http://ollama-macbook.olympus.svc:11434/v1.
#
# Requires: MacBook WireGuard peer UP (router-assigned 10.6.0.2) and
# OLLAMA_HOST=0.0.0.0 on the MacBook.
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-macbook
  namespace: olympus
  labels:
    app: ollama-macbook
spec:
  # No selector on purpose — see header comment.
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama-macbook
  namespace: olympus
  labels:
    app: ollama-macbook
subsets:
  - addresses:
      - ip: 10.6.0.2
    ports:
      - name: http
        port: 11434
        protocol: TCP
