# Obsidian CouchDB secrets — placeholder template
# Apply manually with real values: kubectl apply -f secrets.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: obsidian-sync-env
  namespace: apps
type: Opaque
stringData:
  # CouchDB admin credentials (used by LiveSync)
  COUCHDB_USER: "CHANGE_ME"
  COUCHDB_PASSWORD: "CHANGE_ME"
