# beancount-io dashboard — TanStack Start SSR server.
#
# NOTE: the browser-facing API URL is compiled into the client bundle at BUILD
# time (dashboard/Dockerfile writes .env.production.local from build args), so
# changing it requires rebuilding this image, not just editing the manifest.
#
# VITE_API_URL points at the DASHBOARD host, not beancount-api — backend-v2's
# CORS allowlist is hardcoded to beancount.io, so client-side calls must be
# same-origin. See ingress.yaml for the routing that makes this work. Built with:
#   VITE_API_URL=https://beancount.ramoneees.com/api-gateway/
#   VITE_SSR_API_URL=http://beancount-io-backend.apps.svc.cluster.local:4104/api-gateway/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beancount-io-dashboard
  namespace: apps
  labels:
    app: beancount-io
    component: dashboard
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: beancount-io
      component: dashboard
  template:
    metadata:
      labels:
        app: beancount-io
        component: dashboard
    spec:
      nodeSelector:
        kubernetes.io/hostname: olympus
      containers:
        - name: dashboard
          image: git.ramoneees.com/ramoneees/beancount-io-dashboard:b127f3a
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: beancount-io-dashboard
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: beancount-io
    component: dashboard
  ports:
    - name: http
      port: 3000
      targetPort: http
