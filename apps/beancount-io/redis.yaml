# Dedicated Redis for beancount-io.
#
# Deliberately NOT the shared redis-master.databases: that instance runs
# maxmemory=200MB with allkeys-lru, and beancount-io keeps auth/session state
# in Redis. Upstream's compose pins `--maxmemory-policy noeviction` for exactly
# this reason — under LRU, sessions would be silently evicted under pressure.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beancount-io-redis
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beancount-io-redis
  namespace: apps
  labels:
    app: beancount-io
    component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beancount-io
      component: redis
  template:
    metadata:
      labels:
        app: beancount-io
        component: redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: olympus
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beancount-io-redis
---
apiVersion: v1
kind: Service
metadata:
  name: beancount-io-redis
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: beancount-io
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
