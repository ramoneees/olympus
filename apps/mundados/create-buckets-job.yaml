apiVersion: batch/v1
kind: Job
metadata:
  name: mundados-create-buckets
  namespace: apps
  labels:
    app: mundados-create-buckets
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: mundados-create-buckets
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mundados-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mundados-secrets
                  key: minio-secret-key
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: mundados-config
                  key: S3_ENDPOINT
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for MinIO to be ready..."
              until /usr/bin/mc alias set mundados "$S3_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" >/dev/null 2>&1; do
                echo "MinIO not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "MinIO is ready. Creating buckets..."
              /usr/bin/mc mb --ignore-existing mundados/mundados-raw
              /usr/bin/mc mb --ignore-existing mundados/mundados-bronze
              echo "Buckets created:"
              /usr/bin/mc ls mundados/
