apiVersion: batch/v1
kind: Job
metadata:
  name: mundados-forja
  namespace: apps
  labels:
    app: mundados-forja
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: mundados-forja
    spec:
      restartPolicy: OnFailure
      containers:
        - name: forja
          image: registry.ramoneees.com/mundados-forja:latest
          imagePullPolicy: Always
          command: ["clj", "-M:run"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mundados-secrets
                  key: database-url
            - name: LITELLM_URL
              valueFrom:
                configMapKeyRef:
                  name: mundados-config
                  key: LITELLM_URL
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mundados-secrets
                  key: litellm-api-key
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: mundados-config
                  key: S3_ENDPOINT
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mundados-secrets
                  key: minio-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mundados-secrets
                  key: minio-secret-key
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1500m"
