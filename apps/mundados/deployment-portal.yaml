apiVersion: apps/v1
kind: Deployment
metadata:
  name: mundados-portal
  namespace: apps
  labels:
    app: mundados-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mundados-portal
  template:
    metadata:
      labels:
        app: mundados-portal
    spec:
      containers:
        - name: portal
          image: registry.ramoneees.com/mundados-portal:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mundados-secrets
                  key: database-url
            - name: LITELLM_URL
              value: "http://litellm.apps.svc.cluster.local:4000"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mundados-secrets
                  key: litellm-api-key
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mundados-portal
  namespace: apps
spec:
  selector:
    app: mundados-portal
  ports:
    - port: 3000
      targetPort: 3000
