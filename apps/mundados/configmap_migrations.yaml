                WHEN '1314' THEN 130 - (dd.year - 2021) * 2   -- Santo Tirso
                WHEN '1310' THEN 120 - (dd.year - 2021) * 2   -- Paredes
                ELSE 160
            END
    
            -- ----------------------------------------------------------------
            -- UNEMPLOYMENT_RATE  (%, registered; improving year-on-year 2021-2023)
            -- ----------------------------------------------------------------
            WHEN 'UNEMPLOYMENT_RATE' THEN CASE m.code
                WHEN '1106' THEN 7.2 - (dd.year - 2021) * 0.4   -- Lisboa
