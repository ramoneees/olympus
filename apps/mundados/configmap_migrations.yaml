                WHEN '1310' THEN 4.8 - (dd.year - 2021) * 0.3   -- Paredes
                ELSE 6.0
            END
    
            -- ----------------------------------------------------------------
            -- PURCHASING_POWER_INDEX  (Portugal = 100; stable or slow change)
            -- ----------------------------------------------------------------
            WHEN 'PURCHASING_POWER_INDEX' THEN CASE m.code
                WHEN '1106' THEN 152.0 + (dd.year - 2021) * 1.5  -- Lisboa (highest)
                WHEN '1110' THEN 165.0 + (dd.year - 2021) * 1.5  -- Oeiras (corporate wealth)
                WHEN '1105' THEN 155.0 + (dd.year - 2021) * 1.2  -- Cascais
