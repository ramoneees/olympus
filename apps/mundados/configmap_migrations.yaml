  V013_seed_fact_values.sql: |
    -- V013: seed warehouse.fact_indicator_value with realistic demo data.
    -- Without fact rows, all portal charts show "Sem dados disponíveis".
    -- This gives the MVP demo something to show.
    --
    -- Covers 48 municipalities × 3 years × 5 key indicators = 720 rows.
    -- Values are based on approximate real INE data for 2021-2023.
    -- Real data is loaded by the recolha/forja pipeline.
    -- Idempotent via PRIMARY KEY (id_municipality, id_date, id_indicator).
    --
    -- Indicators used: POP_TOTAL, POP_DENSITY, AGING_INDEX,
    --                  UNEMPLOYMENT_RATE, PURCHASING_POWER_INDEX
    
    INSERT INTO warehouse.fact_indicator_value
        (id_municipality, id_date, id_indicator, id_source, value, quality_flag)
    -- Official codes as 4-char strings matching dim_municipality.official_code
    WITH muni(code, mname) AS (VALUES
        -- Required municipalities (task specification)
        ('1106', 'Lisboa'),
        ('1312', 'Porto'),
        ('0303', 'Braga'),
        ('0603', 'Coimbra'),
        ('0805', 'Faro'),
        ('0705', 'Évora'),
        ('1512', 'Setúbal'),
        ('1009', 'Leiria'),
        ('1823', 'Viseu'),
        ('1609', 'Viana do Castelo'),
        ('0308', 'Guimarães'),
        ('1105', 'Cascais'),
        ('1111', 'Sintra'),
        ('1503', 'Almada'),
        ('1115', 'Amadora'),
        ('1304', 'Gondomar'),
        ('1308', 'Matosinhos'),
        ('1317', 'Vila Nova de Gaia'),
        ('1107', 'Loures'),
        ('1116', 'Odivelas'),
        -- Additional municipalities to reach 48
        ('0105', 'Aveiro'),
        ('0303', 'Braga'),   -- already listed; duplicates filtered by JOIN
        ('0308', 'Guimarães'),
        ('0402', 'Bragança'),
        ('0502', 'Castelo Branco'),
        ('0503', 'Covilhã'),
        ('0605', 'Figueira da Foz'),
        ('0705', 'Évora'),
        ('0801', 'Albufeira'),
        ('0808', 'Loulé'),
        ('0811', 'Portimão'),
        ('0907', 'Guarda'),
        ('1001', 'Alcobaça'),
        ('1006', 'Caldas da Rainha'),
        ('1010', 'Marinha Grande'),
        ('1103', 'Azambuja'),
        ('1104', 'Cadaval'),
        ('1110', 'Oeiras'),
        ('1113', 'Torres Vedras'),
        ('1114', 'Vila Franca de Xira'),
        ('1207', 'Elvas'),
        ('1301', 'Amarante'),
        ('1303', 'Felgueiras'),
        ('1306', 'Maia'),
        ('1310', 'Paredes'),
        ('1314', 'Santo Tirso'),
        ('1315', 'Valongo'),
        ('1401', 'Abrantes'),
        ('1416', 'Santarém'),
        ('1503', 'Almada'),
        ('1510', 'Seixal'),
        ('1609', 'Viana do Castelo'),
        ('1703', 'Chaves'),
        ('1714', 'Vila Real'),
        ('1805', 'Lamego'),
        ('1821', 'Tondela')
    ),
    -- Deduplicate: keep distinct official codes only
    uniq_muni AS (
        SELECT DISTINCT code FROM muni
    ),
    src AS (SELECT id_source FROM warehouse.dim_source WHERE source_code = 'INE'),
    inds AS (
        SELECT id_indicator, indicator_code
        FROM warehouse.dim_indicator
        WHERE indicator_code IN (
            'POP_TOTAL', 'POP_DENSITY', 'AGING_INDEX',
            'UNEMPLOYMENT_RATE', 'PURCHASING_POWER_INDEX'
        )
    )
    SELECT
        dm.id_municipality,
        dd.id_date,
        i.id_indicator,
        s.id_source,
        CASE i.indicator_code
            -- ----------------------------------------------------------------
            -- POP_TOTAL  (residents, approximate Census 2021 base + trend)
            -- ----------------------------------------------------------------
            WHEN 'POP_TOTAL' THEN CASE m.code
                WHEN '1106' THEN 545923 - (dd.year - 2021) * 2200   -- Lisboa: slight decline
                WHEN '1312' THEN 231800 - (dd.year - 2021) * 1200   -- Porto: slight decline
                WHEN '1111' THEN 385954 + (dd.year - 2021) * 3500   -- Sintra: growing
                WHEN '1105' THEN 214158 + (dd.year - 2021) * 1200   -- Cascais: growing
                WHEN '1317' THEN 302092 + (dd.year - 2021) * 2800   -- VN Gaia: growing
                WHEN '0303' THEN 193333 + (dd.year - 2021) * 1100   -- Braga: growing
                WHEN '1308' THEN 172669 + (dd.year - 2021) *  900   -- Matosinhos
                WHEN '1115' THEN 171719 - (dd.year - 2021) *  400   -- Amadora: stable/slight decline
                WHEN '1503' THEN 177259 - (dd.year - 2021) *  200   -- Almada: stable
                WHEN '1107' THEN 207497 + (dd.year - 2021) *  700   -- Loures
                WHEN '1110' THEN 175157 + (dd.year - 2021) *  800   -- Oeiras
                WHEN '1510' THEN 168480 + (dd.year - 2021) * 1000   -- Seixal
                WHEN '1114' THEN 136508 + (dd.year - 2021) *  600   -- VF Xira
                WHEN '1116' THEN 148530 + (dd.year - 2021) *  500   -- Odivelas
                WHEN '1304' THEN 164104 + (dd.year - 2021) *  400   -- Gondomar
                WHEN '1306' THEN 140173 + (dd.year - 2021) *  800   -- Maia
                WHEN '0308' THEN 156830 + (dd.year - 2021) *  700   -- Guimarães
                WHEN '0603' THEN 140796 - (dd.year - 2021) *  600   -- Coimbra: slight decline
                WHEN '1315' THEN  96207 + (dd.year - 2021) *  300   -- Valongo
                WHEN '1314' THEN  68009 + (dd.year - 2021) *  200   -- Santo Tirso
                WHEN '1310' THEN  85895 + (dd.year - 2021) *  300   -- Paredes
                WHEN '0805' THEN  67650 + (dd.year - 2021) *  800   -- Faro: growing (tourism)
                WHEN '0808' THEN  71099 + (dd.year - 2021) * 1200   -- Loulé: growing
                WHEN '0811' THEN  59896 + (dd.year - 2021) *  900   -- Portimão
                WHEN '0801' THEN  44158 + (dd.year - 2021) * 1500   -- Albufeira: tourism growth
                WHEN '1512' THEN 123684 + (dd.year - 2021) *  500   -- Setúbal
                WHEN '1009' THEN 128640 + (dd.year - 2021) *  400   -- Leiria
                WHEN '1823' THEN  99274 - (dd.year - 2021) *  300   -- Viseu: slight decline
                WHEN '1609' THEN  85049 - (dd.year - 2021) *  200   -- Viana do Castelo
                WHEN '0105' THEN  80880 + (dd.year - 2021) *  200   -- Aveiro
                WHEN '1113' THEN  83082 + (dd.year - 2021) *  400   -- Torres Vedras
                WHEN '1001' THEN  54761 + (dd.year - 2021) *  100   -- Alcobaça
                WHEN '1006' THEN  51661 + (dd.year - 2021) *  100   -- Caldas da Rainha
                WHEN '1010' THEN  38681 + (dd.year - 2021) *  200   -- Marinha Grande
                WHEN '0705' THEN  53591 - (dd.year - 2021) *  300   -- Évora: slight decline
                WHEN '0907' THEN  40071 - (dd.year - 2021) *  400   -- Guarda: declining
                WHEN '1416' THEN  57204 - (dd.year - 2021) *  200   -- Santarém
                WHEN '1401' THEN  37571 - (dd.year - 2021) *  300   -- Abrantes
                WHEN '1303' THEN  57386 + (dd.year - 2021) *  200   -- Felgueiras
                WHEN '1301' THEN  54264 + (dd.year - 2021) *  200   -- Amarante
                WHEN '1207' THEN  20919 - (dd.year - 2021) *  200   -- Elvas
                WHEN '0402' THEN  34088 - (dd.year - 2021) *  400   -- Bragança: declining
                WHEN '0502' THEN  52928 - (dd.year - 2021) *  300   -- Castelo Branco
                WHEN '0503' THEN  46455 - (dd.year - 2021) *  400   -- Covilhã
                WHEN '0605' THEN  60586 - (dd.year - 2021) *  200   -- Figueira da Foz
                WHEN '1703' THEN  37592 - (dd.year - 2021) *  300   -- Chaves
                WHEN '1714' THEN  46665 - (dd.year - 2021) *  200   -- Vila Real
                WHEN '1805' THEN  24744 - (dd.year - 2021) *  200   -- Lamego
