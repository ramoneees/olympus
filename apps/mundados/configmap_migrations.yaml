                WHEN '0705' THEN 215 - (dd.year - 2021) * 3   -- Évora (inland aging)
                WHEN '1823' THEN 175 - (dd.year - 2021) * 2   -- Viseu
                WHEN '1609' THEN 160 - (dd.year - 2021) * 2   -- Viana do Castelo
                WHEN '0105' THEN 165 - (dd.year - 2021) * 2   -- Aveiro
                WHEN '1113' THEN 120 - (dd.year - 2021) * 2   -- Torres Vedras
                WHEN '1001' THEN 150 - (dd.year - 2021) * 2   -- Alcobaça
                WHEN '1006' THEN 155 - (dd.year - 2021) * 2   -- Caldas da Rainha
                WHEN '1010' THEN 130 - (dd.year - 2021) * 2   -- Marinha Grande
                WHEN '0907' THEN 260 - (dd.year - 2021) * 3   -- Guarda (very aged interior)
                WHEN '1416' THEN 195 - (dd.year - 2021) * 3   -- Santarém
                WHEN '1401' THEN 230 - (dd.year - 2021) * 3   -- Abrantes (aged interior)
                WHEN '1303' THEN 125 - (dd.year - 2021) * 2   -- Felgueiras
                WHEN '1301' THEN 155 - (dd.year - 2021) * 2   -- Amarante
                WHEN '1207' THEN 235 - (dd.year - 2021) * 3   -- Elvas (aged Alentejo)
                WHEN '0402' THEN 270 - (dd.year - 2021) * 3   -- Bragança (very aged)
                WHEN '0502' THEN 205 - (dd.year - 2021) * 3   -- Castelo Branco
                WHEN '0503' THEN 195 - (dd.year - 2021) * 3   -- Covilhã
                WHEN '0605' THEN 165 - (dd.year - 2021) * 2   -- Figueira da Foz
                WHEN '1703' THEN 195 - (dd.year - 2021) * 3   -- Chaves
                WHEN '1714' THEN 155 - (dd.year - 2021) * 2   -- Vila Real
                WHEN '1805' THEN 185 - (dd.year - 2021) * 2   -- Lamego
                WHEN '1821' THEN 195 - (dd.year - 2021) * 3   -- Tondela
                WHEN '1103' THEN 110 - (dd.year - 2021) * 2   -- Azambuja
