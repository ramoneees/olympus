                WHEN '1207' THEN 10.5 - (dd.year - 2021) * 0.4  -- Elvas (Alentejo border)
                WHEN '0402' THEN 8.5 - (dd.year - 2021) * 0.3   -- Bragança (interior)
                WHEN '0502' THEN 7.8 - (dd.year - 2021) * 0.3   -- Castelo Branco
                WHEN '0503' THEN 8.5 - (dd.year - 2021) * 0.4   -- Covilhã
                WHEN '0605' THEN 7.5 - (dd.year - 2021) * 0.3   -- Figueira da Foz
                WHEN '1703' THEN 7.5 - (dd.year - 2021) * 0.3   -- Chaves
                WHEN '1714' THEN 6.5 - (dd.year - 2021) * 0.3   -- Vila Real
                WHEN '1805' THEN 7.0 - (dd.year - 2021) * 0.3   -- Lamego
