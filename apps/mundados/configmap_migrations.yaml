            -- ----------------------------------------------------------------
            WHEN 'AGING_INDEX' THEN CASE m.code
                WHEN '1106' THEN 190 - (dd.year - 2021) * 3   -- Lisboa (old city, improving)
                WHEN '1312' THEN 210 - (dd.year - 2021) * 3   -- Porto (very aged)
                WHEN '1111' THEN 110 - (dd.year - 2021) * 2   -- Sintra (young families)
