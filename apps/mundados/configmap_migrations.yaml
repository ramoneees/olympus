                WHEN '1113' THEN  155    -- Torres Vedras
                WHEN '1001' THEN  105    -- Alcobaça
                WHEN '1006' THEN  200    -- Caldas da Rainha
                WHEN '1010' THEN  240    -- Marinha Grande
                WHEN '0907' THEN   45    -- Guarda
