                WHEN '0811' THEN 105.0 + (dd.year - 2021) * 0.8  -- Portimão
                WHEN '0801' THEN 110.0 + (dd.year - 2021) * 1.0  -- Albufeira
                WHEN '1512' THEN  96.0 + (dd.year - 2021) * 0.5  -- Setúbal
