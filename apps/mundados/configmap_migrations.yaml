apiVersion: v1
kind: ConfigMap
metadata:
  name: mundados-migrations
  namespace: apps
data:
  V001_warehouse.sql: |
    -- Schemas
    CREATE SCHEMA IF NOT EXISTS warehouse;
    CREATE SCHEMA IF NOT EXISTS staging;
    CREATE SCHEMA IF NOT EXISTS geospatial;
    
    -- Extensions
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    CREATE EXTENSION IF NOT EXISTS postgis;
    
    -- ============================================================
    -- DIMENSION: dim_date
    -- ============================================================
    
    CREATE TABLE IF NOT EXISTS warehouse.dim_date (
        id_date         SERIAL          PRIMARY KEY,
        year            SMALLINT        NOT NULL,
        quarter         SMALLINT        CHECK (quarter BETWEEN 1 AND 4),
        month           SMALLINT        CHECK (month  BETWEEN 1 AND 12),
        reference_date  DATE,
        period_label    TEXT GENERATED ALWAYS AS (
            CASE
                WHEN month   IS NOT NULL THEN year::TEXT || '-' || LPAD(month::TEXT,    2, '0')
                WHEN quarter IS NOT NULL THEN year::TEXT || '-Q'  || quarter::TEXT
                ELSE year::TEXT
            END
        ) STORED,
        CONSTRAINT uq_dim_date UNIQUE (year, quarter, month)
    );
    
    -- ============================================================
    -- DIMENSION: dim_municipality
    -- ============================================================
    
    CREATE TABLE IF NOT EXISTS warehouse.dim_municipality (
        id_municipality     SERIAL          PRIMARY KEY,
        official_code       VARCHAR(8)      NOT NULL UNIQUE,
        municipality_name   TEXT            NOT NULL,
        district            TEXT,
        nuts2_region        TEXT,
        nuts3_region        TEXT,
        municipality_type   TEXT,
        area_km2            NUMERIC(10, 2),
        latest_population   INTEGER,
        latitude            NUMERIC(10, 7),
        longitude           NUMERIC(10, 7),
        is_active           BOOLEAN         NOT NULL DEFAULT TRUE,
        valid_from          DATE,
        valid_to            DATE,
        created_at          TIMESTAMPTZ     NOT NULL DEFAULT NOW(),
        updated_at          TIMESTAMPTZ     NOT NULL DEFAULT NOW()
    );
    
    -- ============================================================
    -- DIMENSION: dim_theme
    -- ============================================================
    
    CREATE TABLE IF NOT EXISTS warehouse.dim_theme (
        id_theme        SERIAL      PRIMARY KEY,
        theme_code      VARCHAR(50) NOT NULL UNIQUE,
        theme_name      TEXT        NOT NULL,
        description     TEXT,
        sort_order      SMALLINT    DEFAULT 99,
        created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    
    INSERT INTO warehouse.dim_theme (theme_code, theme_name, description, sort_order) VALUES
        ('DEMOGRAPHY',          'Demografia',                   'População, estrutura etária, migração, fertilidade, mortalidade',                          1),
        ('ECONOMY',             'Economia e Trabalho',          'Indicadores de emprego, desemprego, densidade empresarial',                                2),
        ('EDUCATION',           'Educação',                     'Matrículas escolares, qualificações, abandono escolar, literacia',                         3),
        ('HEALTH',              'Saúde',                        'Infraestrutura de saúde, mortalidade, doenças crónicas',                                   4),
        ('MUNICIPAL_FINANCES',  'Finanças Municipais',          'Receita, despesa, dívida, capacidade fiscal per capita',                                   5),
        ('TRANSPARENCY',        'Transparência e Governação',   'Índices de transparência, contratos públicos, participação cidadã',                       6),
        ('ENVIRONMENT',         'Ambiente e Território',        'Uso do solo, espaço verde, qualidade do ar, gestão de resíduos',                          7),
        ('INFRASTRUCTURE',      'Infraestruturas e Habitação',  'Estradas, transportes, parque habitacional, conectividade digital',                       8),
        ('SOCIAL',              'Coesão Social e Bem-Estar',    'Pobreza, apoio social, criminalidade, desigualdade',                                      9)
    ON CONFLICT (theme_code) DO NOTHING;
    
    -- ============================================================
    -- DIMENSION: dim_source
    -- ============================================================
    
    CREATE TABLE IF NOT EXISTS warehouse.dim_source (
        id_source       SERIAL      PRIMARY KEY,
        source_code     VARCHAR(50) NOT NULL UNIQUE,
        source_name     TEXT        NOT NULL,
        source_type     TEXT        NOT NULL CHECK (source_type IN (
                            'official_statistics',
                            'open_data_portal',
                            'government_report',
                            'external_index',
                            'municipal_portal',
                            'other'
                        )),
        base_url        TEXT,
        description     TEXT,
        update_frequency TEXT,
        is_active       BOOLEAN     NOT NULL DEFAULT TRUE,
        created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    
    INSERT INTO warehouse.dim_source (source_code, source_name, source_type, base_url, description, update_frequency) VALUES
        ('PORDATA',         'PORDATA',                          'official_statistics',  'https://www.pordata.pt',               'Base de Dados Portugal Contemporâneo',                   'annual'),
        ('INE',             'INE',                              'official_statistics',  'https://www.ine.pt',                   'Instituto Nacional de Estatística',                      'annual'),
        ('MAIS_TRANSP',     'Portal Mais Transparência',        'government_report',    'https://www.maistransparencia.gov.pt', 'Municipal transparency and governance index',             'annual'),
        ('DADOS_GOV',       'dados.gov.pt',                     'open_data_portal',     'https://dados.gov.pt',                 'National open data portal',                              'continuous'),
        ('DGT',             'DGT',                              'official_statistics',  'https://www.dgterritorio.gov.pt',      'Direção-Geral do Território',                            'annual'),
        ('CML_LISBOA',      'Lisboa Aberta (CML)',               'municipal_portal',     'https://lisboaaberta.cm-lisboa.pt',    'Open data portal of Lisbon',                             'continuous'),
        ('CM_PORTO',        'Porto Data (CMP)',                  'municipal_portal',     'https://opendata.cm-porto.pt',         'Open data portal of Porto',                              'continuous'),
        ('DGAL',            'DGAL',                              'official_statistics',  'https://www.dgal.gov.pt',              'Direção-Geral das Autarquias Locais',                    'annual')
    ON CONFLICT (source_code) DO NOTHING;
    
    -- ============================================================
    -- DIMENSION: dim_indicator
    -- ============================================================
    
    CREATE TABLE IF NOT EXISTS warehouse.dim_indicator (
        id_indicator                SERIAL          PRIMARY KEY,
        indicator_code              VARCHAR(100)    NOT NULL UNIQUE,
        name                        TEXT            NOT NULL,
        description                 TEXT,
        id_theme                    INTEGER         NOT NULL REFERENCES warehouse.dim_theme(id_theme),
        id_primary_source           INTEGER         NOT NULL REFERENCES warehouse.dim_source(id_source),
        unit                        TEXT            NOT NULL,
        unit_description            TEXT,
        periodicity                 TEXT            NOT NULL CHECK (periodicity IN (
                                        'annual', 'quarterly', 'monthly', 'point_in_time', 'irregular'
                                    )),
        aggregation_function        TEXT            CHECK (aggregation_function IN (
                                        'sum', 'avg', 'last', 'first', 'min', 'max'
                                    )),
        is_higher_better            BOOLEAN,
        methodological_notes        TEXT,
        external_documentation_url  TEXT,
        source_indicator_code       TEXT,
        is_active                   BOOLEAN         NOT NULL DEFAULT TRUE,
        created_at                  TIMESTAMPTZ     NOT NULL DEFAULT NOW(),
        updated_at                  TIMESTAMPTZ     NOT NULL DEFAULT NOW()
    );
    
    -- ============================================================
    -- FACT TABLE: fact_indicator_value
    -- ============================================================
    
    CREATE TABLE IF NOT EXISTS warehouse.fact_indicator_value (
        id_municipality     INTEGER         NOT NULL REFERENCES warehouse.dim_municipality(id_municipality),
        id_date             INTEGER         NOT NULL REFERENCES warehouse.dim_date(id_date),
        id_indicator        INTEGER         NOT NULL REFERENCES warehouse.dim_indicator(id_indicator),
        id_source           INTEGER         REFERENCES warehouse.dim_source(id_source),
        value               NUMERIC(20, 6),
        ci_min              NUMERIC(20, 6),
        ci_max              NUMERIC(20, 6),
        is_estimated        BOOLEAN         NOT NULL DEFAULT FALSE,
        quality_flag        TEXT            CHECK (quality_flag IN (
                                'verified', 'provisional', 'estimated', 'missing_imputed'
                            )),
        reference_date      DATE,
        raw_value_text      TEXT,
        ingestion_timestamp TIMESTAMPTZ     NOT NULL DEFAULT NOW(),
        ingestion_batch_id  UUID,
        CONSTRAINT pk_fact_indicator_value PRIMARY KEY (id_municipality, id_date, id_indicator)
    );
    
    -- ============================================================
    -- MAPPING: map_municipality_source_name
    -- ============================================================
    
    CREATE TABLE IF NOT EXISTS warehouse.map_municipality_source_name (
        id              SERIAL      PRIMARY KEY,
        id_municipality INTEGER     NOT NULL REFERENCES warehouse.dim_municipality(id_municipality),
        id_source       INTEGER     NOT NULL REFERENCES warehouse.dim_source(id_source),
        name_in_source  TEXT        NOT NULL,
        code_in_source  TEXT,
        is_primary_name BOOLEAN     NOT NULL DEFAULT TRUE,
        created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        CONSTRAINT uq_municipality_source_name UNIQUE (id_source, name_in_source)
    );
    
    -- ============================================================
    -- AUDIT: ingestion_log
    -- ============================================================
    
    CREATE TABLE IF NOT EXISTS warehouse.ingestion_log (
        id              UUID        PRIMARY KEY DEFAULT uuid_generate_v4(),
        id_source       INTEGER     REFERENCES warehouse.dim_source(id_source),
        id_indicator    INTEGER     REFERENCES warehouse.dim_indicator(id_indicator),
        started_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        finished_at     TIMESTAMPTZ,
        status          TEXT        CHECK (status IN ('running', 'loaded', 'processed', 'partial', 'failed')),
        rows_inserted   INTEGER     DEFAULT 0,
        rows_updated    INTEGER     DEFAULT 0,
        rows_rejected   INTEGER     DEFAULT 0,
        error_message   TEXT,
        pipeline_run_id TEXT,
        notes           TEXT
    );
    
    -- ============================================================
    -- GEOSPATIAL: municipality_geometry
    -- ============================================================
    
    CREATE TABLE IF NOT EXISTS geospatial.municipality_geometry (
        id_municipality     INTEGER     NOT NULL REFERENCES warehouse.dim_municipality(id_municipality),
        geom                geometry(MultiPolygon, 4326) NOT NULL,
        caop_version_year   SMALLINT    NOT NULL,
        source_file         TEXT,
        created_at          TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        PRIMARY KEY (id_municipality, caop_version_year)
    );
    
    -- ============================================================
    -- INDEXES
    -- ============================================================
    
    -- fact_indicator_value
    CREATE INDEX IF NOT EXISTS idx_fact_indicator_covering
        ON warehouse.fact_indicator_value (id_indicator, id_date, id_municipality)
        INCLUDE (value, quality_flag);
    
    CREATE INDEX IF NOT EXISTS idx_fact_municipality_covering
        ON warehouse.fact_indicator_value (id_municipality, id_date, id_indicator)
        INCLUDE (value, quality_flag);
    
    CREATE INDEX IF NOT EXISTS idx_fact_date_indicator
        ON warehouse.fact_indicator_value (id_date, id_indicator)
        INCLUDE (id_municipality, value);
    
    CREATE INDEX IF NOT EXISTS idx_fact_verified
        ON warehouse.fact_indicator_value (id_indicator, id_date, id_municipality)
        WHERE quality_flag IN ('verified', 'provisional');
    
    CREATE INDEX IF NOT EXISTS idx_fact_ingestion_brin
        ON warehouse.fact_indicator_value USING BRIN (ingestion_timestamp);
    
    -- dim_municipality
    CREATE INDEX IF NOT EXISTS idx_municipality_nuts2
        ON warehouse.dim_municipality (nuts2_region);
    
    CREATE INDEX IF NOT EXISTS idx_municipality_nuts3
        ON warehouse.dim_municipality (nuts3_region);
    
    CREATE INDEX IF NOT EXISTS idx_municipality_name_trgm
        ON warehouse.dim_municipality USING GIN (municipality_name gin_trgm_ops);
    
    -- dim_indicator
    CREATE INDEX IF NOT EXISTS idx_indicator_theme
        ON warehouse.dim_indicator (id_theme);
    
    CREATE INDEX IF NOT EXISTS idx_indicator_source
        ON warehouse.dim_indicator (id_primary_source);
    
    CREATE INDEX IF NOT EXISTS idx_indicator_name_trgm
        ON warehouse.dim_indicator USING GIN (name gin_trgm_ops);
    
    -- dim_date
    CREATE INDEX IF NOT EXISTS idx_date_year
        ON warehouse.dim_date (year);
    
    -- map_municipality_source_name
    CREATE INDEX IF NOT EXISTS idx_map_municipality_source
        ON warehouse.map_municipality_source_name (id_municipality, id_source);
    
    CREATE INDEX IF NOT EXISTS idx_map_source_name
        ON warehouse.map_municipality_source_name (id_source, name_in_source);
    
    -- geospatial
    CREATE INDEX IF NOT EXISTS idx_municipality_geom
        ON geospatial.municipality_geometry USING GIST (geom);
    

  V002_staging.sql: |
    -- Staging tables: raw landing zone for recolha
    
    -- PORDATA raw extracts
    CREATE TABLE IF NOT EXISTS staging.stg_pordata_raw (
        id                      BIGSERIAL   PRIMARY KEY,
        source_file             TEXT,
        indicator_code_src      TEXT,
        indicator_name_src      TEXT,
        municipality_name_src   TEXT,
        municipality_code_src   TEXT,
        year                    SMALLINT,
        period_label            TEXT,
        raw_value               TEXT,
        unit_src                TEXT,
        loaded_at               TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        batch_id                UUID
    );
    
    -- Mais Transparência
    CREATE TABLE IF NOT EXISTS staging.stg_mais_transparencia_raw (
        id                      BIGSERIAL   PRIMARY KEY,
        source_file             TEXT,
        indicator_code_src      TEXT,
        indicator_name_src      TEXT,
        indicator_area_src      TEXT,
        municipality_name_src   TEXT,
        municipality_code_src   TEXT,
        year                    SMALLINT,
        raw_value               TEXT,
        unit_src                TEXT,
        loaded_at               TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        batch_id                UUID
    );
    
    -- INE
    CREATE TABLE IF NOT EXISTS staging.stg_ine_raw (
        id                      BIGSERIAL   PRIMARY KEY,
        source_file             TEXT,
        indicator_code_src      TEXT,
        indicator_name_src      TEXT,
        nuts_level              TEXT,
        territory_code_src      TEXT,
        territory_name_src      TEXT,
        year                    SMALLINT,
        period_label            TEXT,
        raw_value               TEXT,
        unit_src                TEXT,
        extra_metadata          JSONB,
        loaded_at               TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        batch_id                UUID
    );
    
    -- Generic municipal portal staging
    CREATE TABLE IF NOT EXISTS staging.stg_municipal_portal_raw (
        id                      BIGSERIAL   PRIMARY KEY,
        portal_id               TEXT        NOT NULL,
        dataset_name            TEXT,
        indicator_name_src      TEXT,
        municipality_name_src   TEXT,
        municipality_code_src   TEXT,
        year                    SMALLINT,
        period_label            TEXT,
        raw_value               TEXT,
        unit_src                TEXT,
        extra_metadata          JSONB,
        source_url              TEXT,
        loaded_at               TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        batch_id                UUID
    );
    
    -- BRIN indexes on append-only staging tables
    CREATE INDEX IF NOT EXISTS idx_stg_pordata_loaded   ON staging.stg_pordata_raw            USING BRIN (loaded_at);
    CREATE INDEX IF NOT EXISTS idx_stg_mt_loaded        ON staging.stg_mais_transparencia_raw  USING BRIN (loaded_at);
    CREATE INDEX IF NOT EXISTS idx_stg_ine_loaded       ON staging.stg_ine_raw                 USING BRIN (loaded_at);
    CREATE INDEX IF NOT EXISTS idx_stg_municipal_loaded ON staging.stg_municipal_portal_raw    USING BRIN (loaded_at);
    

  V003_rag_schema.sql: |
    -- RAG schema: pgvector embeddings for LLM chat
    
    CREATE EXTENSION IF NOT EXISTS vector;
    
    CREATE SCHEMA IF NOT EXISTS rag;
    
    CREATE TABLE IF NOT EXISTS rag.document_embeddings (
        id          SERIAL PRIMARY KEY,
        content     TEXT NOT NULL,
        embedding   vector(1024) NOT NULL,
        metadata    JSONB NOT NULL DEFAULT '{}',
        chunk_type  TEXT NOT NULL,
        batch_id    UUID REFERENCES warehouse.ingestion_log(id),
        created_at  TIMESTAMPTZ DEFAULT NOW(),
        updated_at  TIMESTAMPTZ DEFAULT NOW()
    );
    
    CREATE INDEX IF NOT EXISTS idx_rag_embedding_hnsw ON rag.document_embeddings
        USING hnsw (embedding vector_cosine_ops) WITH (m = 16, ef_construction = 200);
    
    CREATE INDEX IF NOT EXISTS idx_rag_metadata_gin ON rag.document_embeddings USING GIN (metadata);
    
    CREATE INDEX IF NOT EXISTS idx_rag_batch_id ON rag.document_embeddings (batch_id);
    

