                WHEN '1010' THEN  90.0 + (dd.year - 2021) * 0.4  -- Marinha Grande (glass industry)
                WHEN '0907' THEN  72.0 + (dd.year - 2021) * 0.2  -- Guarda (interior, lower)
                WHEN '1416' THEN  75.0 + (dd.year - 2021) * 0.2  -- Santarém
                WHEN '1401' THEN  68.0 + (dd.year - 2021) * 0.2  -- Abrantes
                WHEN '1303' THEN  85.0 + (dd.year - 2021) * 0.3  -- Felgueiras (footwear industry)
                WHEN '1301' THEN  78.0 + (dd.year - 2021) * 0.2  -- Amarante
                WHEN '1207' THEN  65.0 + (dd.year - 2021) * 0.2  -- Elvas
                WHEN '0402' THEN  68.0 + (dd.year - 2021) * 0.2  -- Bragança
                WHEN '0502' THEN  75.0 + (dd.year - 2021) * 0.2  -- Castelo Branco
                WHEN '0503' THEN  73.0 + (dd.year - 2021) * 0.2  -- Covilhã
                WHEN '0605' THEN  88.0 + (dd.year - 2021) * 0.3  -- Figueira da Foz
                WHEN '1703' THEN  72.0 + (dd.year - 2021) * 0.2  -- Chaves
                WHEN '1714' THEN  82.0 + (dd.year - 2021) * 0.2  -- Vila Real
                WHEN '1805' THEN  74.0 + (dd.year - 2021) * 0.2  -- Lamego
                WHEN '1821' THEN  76.0 + (dd.year - 2021) * 0.2  -- Tondela
                WHEN '1103' THEN  82.0 + (dd.year - 2021) * 0.3  -- Azambuja
                WHEN '1104' THEN  78.0 + (dd.year - 2021) * 0.2  -- Cadaval
                WHEN '1314' THEN  84.0 + (dd.year - 2021) * 0.3  -- Santo Tirso
                WHEN '1310' THEN  82.0 + (dd.year - 2021) * 0.3  -- Paredes
                ELSE 80.0
            END
        END AS value,
        'provisional' AS quality_flag
    FROM uniq_muni m
    JOIN warehouse.dim_municipality dm ON dm.official_code = m.code
    CROSS JOIN (
        SELECT id_date, year
        FROM warehouse.dim_date
        WHERE year IN (2021, 2022, 2023)
    ) dd
    CROSS JOIN inds i
    JOIN src s ON TRUE
    ON CONFLICT (id_municipality, id_date, id_indicator)
        DO UPDATE SET
            value        = EXCLUDED.value,
            quality_flag = EXCLUDED.quality_flag;
    

