                WHEN '1103' THEN  21814 + (dd.year - 2021) *  200   -- Azambuja
                WHEN '1104' THEN  13733 + (dd.year - 2021) *  100   -- Cadaval
                ELSE 20000
            END
    
            -- ----------------------------------------------------------------
            -- POP_DENSITY  (hab/km²; static — area does not change year-to-year)
            -- ----------------------------------------------------------------
            WHEN 'POP_DENSITY' THEN CASE m.code
                WHEN '1106' THEN 6580    -- Lisboa (city core — extremely dense)
                WHEN '1115' THEN 7800    -- Amadora (densest municipality in PT)
                WHEN '1116' THEN 5200    -- Odivelas
                WHEN '1312' THEN 4500    -- Porto
                WHEN '1110' THEN 3700    -- Oeiras
                WHEN '1105' THEN 1660    -- Cascais
                WHEN '1503' THEN 2300    -- Almada
                WHEN '1510' THEN 2100    -- Seixal
                WHEN '1308' THEN 2050    -- Matosinhos
                WHEN '1107' THEN 1500    -- Loures
                WHEN '1111' THEN  870    -- Sintra (large territory)
                WHEN '1317' THEN 1240    -- VN Gaia
                WHEN '1114' THEN  890    -- VF Xira
                WHEN '1304' THEN 1100    -- Gondomar
                WHEN '1306' THEN 1050    -- Maia
                WHEN '1315' THEN 1180    -- Valongo
                WHEN '0308' THEN  870    -- Guimarães
                WHEN '0303' THEN  760    -- Braga (urban)
                WHEN '0603' THEN  290    -- Coimbra (large rural fringe)
                WHEN '1512' THEN  590    -- Setúbal
                WHEN '1009' THEN  175    -- Leiria
                WHEN '0805' THEN  390    -- Faro
                WHEN '0808' THEN  110    -- Loulé (large area)
