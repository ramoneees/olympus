apiVersion: batch/v1
kind: Job
metadata:
  name: mundados-seed-rag
  namespace: apps
  labels:
    app: mundados-seed-rag
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: mundados-seed-rag
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed-rag
          image: registry.ramoneees.com/mundados-recolha:latest
          imagePullPolicy: Always
          command: ["python", "/app/src/recolha/scripts/seed_rag.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mundados-secrets
                  key: database-url
            - name: LITELLM_URL
              valueFrom:
                configMapKeyRef:
                  name: mundados-config
                  key: LITELLM_URL
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mundados-secrets
                  key: litellm-api-key
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
