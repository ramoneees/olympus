apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: apps
---
# Long-lived token for kubeconfig (k8s 1.24+)
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: apps
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-restarter
  namespace: apps
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer-restarter
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: apps
roleRef:
  kind: Role
  name: deployment-restarter
  apiGroup: rbac.authorization.k8s.io
