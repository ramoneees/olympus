apiVersion: batch/v1
kind: CronJob
metadata:
  name: mundados-recolha
  namespace: apps
  labels:
    app: mundados-recolha
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: recolha
              image: registry.ramoneees.com/mundados-recolha:latest
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: mundados-secrets
                      key: database-url
                - name: S3_ENDPOINT
                  value: "http://minio.apps.svc.cluster.local:9000"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: mundados-secrets
                      key: minio-access-key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: mundados-secrets
                      key: minio-secret-key
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "200m"
                limits:
                  memory: "512Mi"
                  cpu: "1000m"
