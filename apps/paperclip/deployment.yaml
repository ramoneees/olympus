---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip
  namespace: apps
  labels:
    app: paperclip
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperclip
  template:
    metadata:
      labels:
        app: paperclip
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: ghcr.io/paperclipai/paperclip:latest
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 /paperclip
              CONFIG=/paperclip/instances/default/config.json
              if [ -f "$CONFIG" ]; then
                node -e "
                  const fs = require('fs');
                  const c = JSON.parse(fs.readFileSync('$CONFIG', 'utf8'));
                  c.server.deploymentMode = 'authenticated';
                  c.server.host = '0.0.0.0';
                  c.server.bind = 'lan';
                  fs.writeFileSync('$CONFIG', JSON.stringify(c, null, 2));
                  console.log('Config patched:', JSON.stringify({deploymentMode: c.server.deploymentMode, host: c.server.host, bind: c.server.bind}));
                "
                chown 1000:1000 "$CONFIG"
              fi
          volumeMounts:
            - name: paperclip-data
              mountPath: /paperclip
      containers:
        - name: paperclip
          image: ghcr.io/paperclipai/paperclip:latest
          ports:
            - name: http
              containerPort: 3100
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paperclip-secret
                  key: database-url
            - name: PORT
              value: "3100"
            - name: HOST
              value: "0.0.0.0"
            - name: SERVE_UI
              value: "true"
            - name: PAPERCLIP_DEPLOYMENT_MODE
              value: "authenticated"
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              value: "private"
            - name: PAPERCLIP_PUBLIC_URL
              value: "https://tekton.ramoneees.com"
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: paperclip-secret
                  key: better-auth-secret
          volumeMounts:
            - name: paperclip-data
              mountPath: /paperclip
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: paperclip-data
          persistentVolumeClaim:
            claimName: paperclip-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperclip-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paperclip
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: paperclip
  ports:
    - name: http
      port: 3100
      targetPort: 3100
