---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: beancount
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`beancount.ramoneees.com`)
      kind: Rule
      services:
        - name: beancount
          port: 5000
  tls:
    secretName: wildcard-ramoneees-com-tls
