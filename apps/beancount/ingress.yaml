---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: beancount
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    # Temporary during the beancount-io cutover: beancount.ramoneees.com now
    # serves the beancount-io dashboard (apps/beancount-io/). Fava stays
    # reachable here until the new stack is verified, then this app is removed.
    - match: Host(`fava.ramoneees.com`)
      kind: Rule
      services:
        - name: beancount
          port: 5000
  tls:
    secretName: wildcard-ramoneees-com-tls
