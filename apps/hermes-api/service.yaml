---
# Selector-less Service + hand-written Endpoints -> Hermes api_server on the Mac mini (LAN).
# Kubernetes only auto-manages Endpoints for Services WITH a selector; without one this
# Endpoints object stays exactly as written and Traefik routes to it like any Service.
apiVersion: v1
kind: Service
metadata:
  name: hermes-api
  namespace: apps
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8645
      targetPort: 8645
---
apiVersion: v1
kind: Endpoints
metadata:
  name: hermes-api
  namespace: apps
subsets:
  - addresses:
      - ip: 192.168.50.12
    ports:
      - name: http
        port: 8645
        protocol: TCP
