# hermes-mini — Hermes Agent web dashboard running OUTSIDE the cluster,
# on the Mac mini (192.168.50.12:9119).
#
# Pattern: Service WITHOUT a selector + a hand-managed Endpoints object.
# Kubernetes only auto-manages Endpoints for Services that have a selector,
# so with no selector this Endpoints stays exactly as written and points the
# Service at the external LAN IP. Traefik then routes to it like any in-cluster
# Service. This is the canonical way to put a non-cluster workload behind the
# wildcard ingress + TLS cert.
#
# If the Mac mini's LAN IP changes (DHCP), update the address below.
# Consider a DHCP reservation for the mini to avoid that.
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-mini
  namespace: apps
  labels:
    app: hermes-mini
spec:
  # No selector on purpose — see header comment.
  ports:
    - name: http
      port: 9119
      targetPort: 9119
---
apiVersion: v1
kind: Endpoints
metadata:
  name: hermes-mini
  namespace: apps
  labels:
    app: hermes-mini
subsets:
  - addresses:
      - ip: 192.168.50.12
    ports:
      - name: http
        port: 9119
        protocol: TCP
