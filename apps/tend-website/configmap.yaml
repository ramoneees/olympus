# Tend pitch website — static content served by nginx:alpine via ConfigMap mount.
# Source: ~/dev/tend-website/index.html (Claude Code build, 2026-08-20). Single page, no external requests.
# Update content here, commit, Flux syncs, Reloader restarts the pod.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tend-website-content
  namespace: apps
  labels:
    app: tend-website
data:
  nginx.conf: |
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_vary on;
        gzip_min_length 256;
        gzip_types text/plain text/css application/json application/javascript image/svg+xml;

        try_files $uri $uri/ =404;

        location = / {
            add_header Cache-Control "public, max-age=300" always;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="pt">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tend — more than a team, a family.</title>
    <meta name="description" content="Tend é a app de coparentalidade que torna visível e partilhada a carga mental de criar filhos pequenos. Mais do que uma equipa, uma família.">
    <meta name="theme-color" content="#FAF6F1">
    <style>
      :root {
        --bg-canvas: #FAF6F1;
        --bg-surface: #FFFFFF;
        --bg-surface-muted: #F1EAE2;
        --text-primary: #2E2A26;
        --text-secondary: #6F665E;
        --text-muted: #A89E94;
        --border-subtle: #E7DED4;
        --brand-primary: #D97757;
        --brand-primary-hover: #C2654A;
        --brand-secondary: #7C9885;
        --status-attention: #E0A458;
        --status-urgent: #D9694F;
        --status-info: #8AA6C1;
        --accent-terracotta: #D97757;
        --accent-sage: #7C9885;
        --accent-blue: #8AA6C1;
        --accent-ochre: #C9A35C;
        --accent-plum: #A98AB4;
      }

      * { box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--bg-canvas);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      img, svg { max-width: 100%; }

      a {
        color: var(--brand-primary);
      }

      a:focus-visible,
      button:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid var(--brand-primary);
        outline-offset: 3px;
        border-radius: 4px;
      }

      .wrap {
        max-width: 780px;
        margin: 0 auto;
        padding: 0 24px;
      }

      section {
        padding: 72px 0;
      }

      section:first-of-type {
        padding-top: 96px;
      }

      h1, h2, h3 {
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.01em;
        margin: 0 0 0.5em 0;
      }

      h1 {
        font-size: clamp(2.4rem, 6vw, 3.6rem);
      }

      h2 {
        font-size: clamp(1.7rem, 4vw, 2.4rem);
      }

      h3 {
        font-size: 1.15rem;
        margin-bottom: 0.3em;
      }

      p {
        margin: 0 0 1em 0;
        color: var(--text-secondary);
        font-size: 1.05rem;
      }

      .eyebrow {
        display: inline-block;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--brand-secondary);
        margin-bottom: 1em;
      }

      .lede {
        font-size: 1.25rem;
        color: var(--text-primary);
      }

      /* ---------- Hero ---------- */

      header.hero {
        background: var(--bg-canvas);
        border-bottom: 1px solid var(--border-subtle);
      }

      .wordmark {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin-bottom: 2.5em;
      }

      .hero-tagline {
        font-size: clamp(1.15rem, 2.6vw, 1.4rem);
        color: var(--text-secondary);
        margin-bottom: 1.2em;
        font-weight: 500;
      }

      .hero-pitch {
        font-size: 1.15rem;
        max-width: 60ch;
      }

      .cta-primary {
        display: inline-block;
        background: var(--brand-primary);
        color: #FFFFFF;
        text-decoration: none;
        font-weight: 600;
        font-size: 1.05rem;
        padding: 14px 28px;
        border-radius: 999px;
        margin-top: 1em;
        transition: background-color 0.15s ease;
      }

      .cta-primary:hover {
        background: var(--brand-primary-hover);
      }

      /* ---------- Cards ---------- */

      .card {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 20px;
        padding: 28px;
      }

      .scenario-list {
        display: grid;
        gap: 16px;
        margin-top: 2em;
        padding: 0;
        list-style: none;
      }

      .scenario {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 20px;
        padding: 22px 24px;
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }

      .scenario-dot {
        flex-shrink: 0;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-top: 8px;
      }

      .scenario p {
        margin: 0;
        color: var(--text-primary);
        font-size: 1.05rem;
      }

      .scenario-tag {
        display: block;
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 6px;
      }

      /* ---------- Resposta ---------- */

      .contrast {
        display: grid;
        gap: 16px;
        margin-top: 2em;
      }

      @media (min-width: 640px) {
        .contrast {
          grid-template-columns: 1fr 1fr;
        }
      }

      .contrast-card {
        border-radius: 20px;
        padding: 24px;
        border: 1px solid var(--border-subtle);
      }

      .contrast-card.no {
        background: var(--bg-surface-muted);
      }

      .contrast-card.yes {
        background: var(--bg-surface);
        border-color: var(--brand-secondary);
      }

      .contrast-card h3 {
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .contrast-card.no h3 { color: var(--text-muted); }
      .contrast-card.yes h3 { color: var(--brand-secondary); }

      .contrast-card p {
        font-size: 0.98rem;
        margin-bottom: 0;
      }

      /* ---------- Como funciona ---------- */

      .steps {
        display: grid;
        gap: 20px;
        margin-top: 2em;
      }

      .step {
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }

      .step-num {
        flex-shrink: 0;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--bg-surface-muted);
        color: var(--brand-primary);
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.95rem;
      }

      .step-body h3 {
        margin-bottom: 0.2em;
      }

      .step-body p {
        margin-bottom: 0;
      }

      /* ---------- Handoff mockup ---------- */

      .mockup {
        margin-top: 2.5em;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 20px;
        padding: 20px;
        max-width: 420px;
      }

      .mockup-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--accent-terracotta);
        color: #fff;
        font-weight: 700;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mockup-header-text {
        display: flex;
        flex-direction: column;
      }

      .mockup-name {
        font-weight: 600;
        font-size: 0.92rem;
        color: var(--text-primary);
      }

      .mockup-time {
        font-size: 0.78rem;
        color: var(--text-muted);
      }

      .mockup-note {
        background: var(--bg-surface-muted);
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 1rem;
        color: var(--text-primary);
        margin-bottom: 12px;
      }

      .mockup-tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .mockup-tag {
        font-size: 0.78rem;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--bg-canvas);
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
      }

      .mockup-tag.attention {
        color: var(--status-attention);
        border-color: var(--status-attention);
        background: #FBF1E2;
      }

      /* ---------- Para quem / Oportunidade ---------- */

      .who-line {
        font-size: 1.1rem;
      }

      .who-line .later {
        color: var(--text-muted);
      }

      section.opportunity {
        padding: 40px 0;
      }

      section.opportunity .card {
        background: var(--bg-surface-muted);
        border-color: var(--border-subtle);
      }

      /* ---------- CTA final ---------- */

      section.final-cta {
        text-align: center;
      }

      section.final-cta .wrap {
        max-width: 560px;
      }

      section.final-cta p {
        font-size: 1.1rem;
      }

      /* ---------- Footer ---------- */

      footer {
        border-top: 1px solid var(--border-subtle);
        padding: 32px 0 48px;
      }

      footer p {
        font-size: 0.9rem;
        color: var(--text-muted);
        margin: 0;
        text-align: center;
      }

      @media (max-width: 480px) {
        section { padding: 56px 0; }
        section:first-of-type { padding-top: 64px; }
      }
    </style>
    </head>
    <body>

    <header class="hero">
      <div class="wrap">
        <p class="wordmark">Tend</p>
        <p class="hero-tagline">Mais do que uma equipa, uma família.</p>
        <h1>Criar um filho não é uma lista de tarefas. Mas alguém anda sempre a fazer as contas todas na cabeça.</h1>
        <p class="hero-pitch">O Tend é a app de coparentalidade que torna essa carga visível — e partilhada. Não mais um checklist. Um sítio onde os dois sabem, ao mesmo tempo, o que a família precisa agora.</p>
        <a class="cta-primary" href="#como-funciona">Ver como funciona</a>
      </div>
    </header>

    <main>

      <section id="problema" aria-labelledby="problema-title">
        <div class="wrap">
          <span class="eyebrow">O problema</span>
          <h2 id="problema-title">Há sempre alguém a fazer o filme mental inteiro</h2>
          <p class="lede">Não é falta de amor, nem falta de esforço. É que um de vocês anda sempre um passo à frente — a lembrar, a antecipar, a verificar se está tudo tratado. E o outro nem sempre percebe que esse trabalho existe.</p>
          <ul class="scenario-list">
            <li class="scenario">
              <span class="scenario-dot" style="background: var(--accent-terracotta);"></span>
              <div>
                <p>A educadora mandou um recado sobre levar fruta amanhã. Só um de vocês viu a mensagem — e só um de vocês se vai lembrar de o fazer.</p>
                <span class="scenario-tag">quem é que se lembra do pedido da creche</span>
              </div>
            </li>
            <li class="scenario">
              <span class="scenario-dot" style="background: var(--accent-blue);"></span>
              <div>
                <p>São duas da manhã, ela está a chorar, e só um de vocês sabe onde ficou a chupeta desta vez.</p>
                <span class="scenario-tag">quem sabe onde está a chupeta</span>
              </div>
            </li>
            <li class="scenario">
              <span class="scenario-dot" style="background: var(--accent-ochre);"></span>
              <div>
                <p>A vacina foi marcada há um mês. Um de vocês já lembrou o outro três vezes esta semana — e ainda não tem a certeza se vai acontecer.</p>
                <span class="scenario-tag">quem lembra o outro — três vezes</span>
              </div>
            </li>
          </ul>
        </div>
      </section>

      <section id="resposta" aria-labelledby="resposta-title">
        <div class="wrap">
          <span class="eyebrow">A resposta Tend</span>
          <h2 id="resposta-title">Visível e partilhada. Não é mais um checklist.</h2>
          <p class="lede">Uma lista de tarefas trata sintomas. O Tend trata da causa: a carga que um de vocês carrega sozinho, na cabeça, sem que o outro sequer a veja. O objetivo não é ter mais uma app para gerir. É que os dois vejam a mesma coisa, ao mesmo tempo.</p>
          <div class="contrast">
            <div class="contrast-card no">
              <h3>Uma app de tarefas</h3>
              <p>Regista o que falta fazer. Não mostra quem anda a pensar nisso, nem porquê, nem desde quando.</p>
            </div>
            <div class="contrast-card yes">
              <h3>O Tend</h3>
              <p>Mostra o que a família precisa agora, quem está a tratar, e o contexto para o outro entrar sem perguntar tudo de novo.</p>
            </div>
          </div>
        </div>
      </section>

      <section id="como-funciona" aria-labelledby="como-funciona-title">
        <div class="wrap">
          <span class="eyebrow">Como funciona</span>
          <h2 id="como-funciona-title">Um ciclo simples, pensado para o dia a dia real</h2>
          <div class="steps">
            <div class="step">
              <span class="step-num">1</span>
              <div class="step-body">
                <h3>Criam a vossa família</h3>
                <p>Adicionam quem faz parte — os filhos, os dois, quem mais ajuda. Leva dois minutos.</p>
              </div>
            </div>
            <div class="step">
              <span class="step-num">2</span>
              <div class="step-body">
                <h3>A vista de Hoje</h3>
                <p>O ecrã principal não é uma lista infinita. É o que está a acontecer agora e o que precisa de vocês — nada mais.</p>
              </div>
            </div>
            <div class="step">
              <span class="step-num">3</span>
              <div class="step-body">
                <h3>Rotinas e tarefas, com dono claro</h3>
                <p>Cada coisa tem quem está a tratar — "quem está nisto", não um "responsável" com prazo. A linguagem é a de uma família, não a de um projeto.</p>
              </div>
            </div>
            <div class="step">
              <span class="step-num">4</span>
              <div class="step-body">
                <h3>Entregas com contexto</h3>
                <p>Quando um de vocês assume, o outro não entra às escuras. Um pequeno recado diz o essencial.</p>
              </div>
            </div>
          </div>

          <div class="mockup" role="group" aria-label="Exemplo de entrega com contexto">
            <div class="mockup-header">
              <span class="avatar" aria-hidden="true">M</span>
              <div class="mockup-header-text">
                <span class="mockup-name">Mariana entregou a tarde</span>
                <span class="mockup-time">há 4 minutos</span>
              </div>
            </div>
            <p class="mockup-note">"Acordou agora, ainda não comeu, um pouco irritada."</p>
            <div class="mockup-tags">
              <span class="mockup-tag attention">precisa de ti</span>
              <span class="mockup-tag">soneca — tarde</span>
            </div>
          </div>
        </div>
      </section>

      <section id="para-quem" aria-labelledby="para-quem-title">
        <div class="wrap">
          <span class="eyebrow">Para quem é</span>
          <h2 id="para-quem-title">Casais com filhos pequenos, agora</h2>
          <p class="who-line">O Tend nasce para vocês: um casal a criar uma criança pequena, a tentar não deixar cair nada nem se perderem um ao outro no processo. <span class="later">Mais tarde, o mesmo modelo serve para outros cuidados de família — pais idosos, outros dependentes. Mas isso é depois.</span></p>
        </div>
      </section>

      <section class="opportunity" aria-labelledby="oportunidade-title">
        <div class="wrap">
          <span class="eyebrow">Porquê agora</span>
          <h2 id="oportunidade-title" style="font-size: 1.4rem;">Um espaço vazio entre duas categorias</h2>
          <div class="card">
            <p>Hoje há apps de bebé — sono, mamas, crescimento — feitas para registar a criança. E há apps de tarefas — feitas para gerir trabalho. Nenhuma foi pensada para a relação entre os dois adultos e para a carga que passa entre eles. Não temos números de mercado para mostrar — só o problema, que reconhecemos porque o vivemos.</p>
          </div>
        </div>
      </section>

      <section id="cta" class="final-cta" aria-labelledby="cta-title">
        <div class="wrap">
          <h2 id="cta-title">Queres conversar?</h2>
          <p>Isto ainda é um início. Gostava de o construir com alguém em quem confio — não só para me ajudar, mas porque acredito que isto merece ser feito bem.</p>
          <a class="cta-primary" href="mailto:ramonp.rios@gmail.com">Escrever para ramonp.rios@gmail.com</a>
        </div>
      </section>

    </main>

    <footer>
      <div class="wrap">
        <p>Tend — more than a team, a family. · 2026</p>
      </div>
    </footer>

    </body>
    </html>
