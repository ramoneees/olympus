# cert-manager Helm values
# Chart: cert-manager
# Repo: https://charts.jetstack.io

crds:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

cainjector:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi

# Self-check de DNS-01 via recursivos v4 — os nodes nao tem rota IPv6 e o
# conjunto default inclui resolvedores v6 (check trava "not yet propagated")
extraArgs:
  dns01-recursive-nameservers: "1.1.1.1:53,8.8.8.8:53"
