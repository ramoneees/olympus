# AlertmanagerConfig — route alerts to different receivers based on severity/labels
# Critical → Telegram + n8n (auto-remediation)
# Warning/Info → n8n only (log only, no auto-remediation)
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: incident-routing
  namespace: monitoring
  labels:
    alertmanagerConfig: incident-routing
spec:
  receivers:
    - name: critical
      webhookConfigs:
        - url: https://n8n.ramoneees.com/webhook/prometheus-alerts
          sendResolved: true
    - name: warning
      webhookConfigs:
        - url: https://n8n.ramoneees.com/webhook/prometheus-alerts
          sendResolved: true
    - name: "null"
    - name: default
      webhookConfigs:
        - url: https://n8n.ramoneees.com/webhook/prometheus-alerts
          sendResolved: true

  route:
    groupBy:
      - alertname
      - namespace
    groupWait: 10s
    groupInterval: 10s
    repeatInterval: 4h
    receiver: default
    routes:
      # Critical severity → Hermes auto-remediation path
      - match:
          severity: critical
        receiver: critical
        continue: false
      # Warning severity → n8n (no auto-remediation, just logging/escalation)
      - match:
          severity: warning
        receiver: warning
        continue: false
      # K8s pod crashes → immediate notification
      - match:
          namespace: apps
        receiver: warning
        continue: false
        # Don't group K8s pod alerts — get them immediately
        groupInterval: 0s