# kube-prometheus-stack — Prometheus, Grafana, Alertmanager, node-exporter
# Tuned for 2-node homelab (NiPoGi N100 16GB + Ryzen 5600X 64GB)

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  sidecar:
    datasources:
      enabled: true
    dashboards:
      enabled: true
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 16GB  # size cap — leaves ~4Gi headroom on 40Gi PVC; prevents PVC exhaustion
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 40Gi
    # Scrape all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 10s
      group_interval: 10s
      receiver: 'n8n-webhook'
      routes:
        - match:
            severity: critical
          receiver: 'n8n-webhook'
          continue: false
        - match:
            severity: warning
          receiver: 'n8n-webhook'
          continue: false
    receivers:
      - name: 'null'
      - name: 'n8n-webhook'
        webhook_configs:
          - url: 'https://n8n.ramoneees.com/webhook/prometheus-alerts'
            send_resolved: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

# Disable components that don't apply to k3s
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
