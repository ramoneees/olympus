# NVIDIA GPU Operator — exposes RTX 2080 on olympus node
# Chart: https://nvidia.github.io/gpu-operator
# Only the olympus node has a GPU; the operator auto-discovers it.

# Use the pre-installed driver on the host (Ubuntu 24.04 ships nvidia drivers).
# enabled: false tells the operator NOT to deploy its own driver DaemonSet —
# left at true, the operator's driver daemonset never matches this node (NFD
# labels it nvidia.com/gpu.deploy.driver=pre-installed, not "true"), so it
# never runs, never writes the readiness marker every other GPU component
# waits on, and the whole stack stays notReady forever.
driver:
  enabled: false

# driverInstallDir defaults to /run/nvidia/driver, which is only populated
# when the operator manages its own driver container. With a pre-installed
# host driver the files live at the normal system paths under /, so the
# validator's driver-validation init container must look at host root
# instead — otherwise it polls an empty path forever and every other
# component (toolkit, device-plugin, dcgm-exporter, gfd) stays stuck in Init.
hostPaths:
  driverInstallDir: "/"

toolkit:
  enabled: true

devicePlugin:
  enabled: true

# Disable components we don't need in a 2-node homelab
dcgmExporter:
  enabled: true

migManager:
  enabled: false

gfd:
  enabled: true           # GPU Feature Discovery — labels the node

nodeStatusExporter:
  enabled: false

sandboxDevicePlugin:
  enabled: false

vfioManager:
  enabled: false

vgpuManager:
  enabled: false

vgpuDeviceManager:
  enabled: false

# Node selector — only run operator components on the GPU node
node-feature-discovery:
  worker:
    nodeSelector:
      kubernetes.io/hostname: olympus
