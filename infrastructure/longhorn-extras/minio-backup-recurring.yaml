# Longhorn RecurringJob — MinIO volume snapshot to B2
# Volumes opt in with label: recurring-job.longhorn.io/minio-backup-recurring: enabled
#
# MinIO holds the extracted financial JSONs (n8n "Faturas" workflows) and
# beancount-io assets, so it is layer-2 backup material like the databases.
# Runs at 05:45, after the Redis job at 05:30.
#
# To label the MinIO volume:
#   VOL=$(kubectl get pv -o jsonpath='{range .items[?(@.spec.claimRef.name=="minio-data")]}{.spec.csi.volumeHandle}{end}')
#   kubectl -n longhorn-system label volume/$VOL recurring-job.longhorn.io/minio-backup-recurring=enabled
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: minio-backup-recurring
  namespace: longhorn-system
spec:
  name: minio-backup-recurring
  task: backup
  cron: "45 5 * * *"
  retain: 7
  concurrency: 1
  labels:
    app: minio
    backup-tier: layer2
